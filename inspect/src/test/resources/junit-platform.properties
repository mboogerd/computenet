# Capture a thread dump at the moment a :inspect test hits the 5-minute method
# timeout, instead of only learning that it did.
#
# Why this module, and why this property (computenet-8ru.3):
#
# InspectorErrorsTest > "routerInlet routing failures dead-letter host-wide"
# hung for exactly 5 minutes on CI run 31297641980 (2026-08-09 06:04:19Z) and
# has never reproduced locally. The CI log localises the stall precisely -- by
# 05:59:28Z every other task in the build had flushed its output and finished,
# so the :inspect test JVM was the only thing running, and it emitted nothing
# at all for 4m51s before resuming at full speed -- but it cannot localise it
# *in the JVM*: every wait reachable from that method body is bounded well
# under 5 minutes (5s SSE attach, 10s frame await, and VirtualThreadScheduler
# .await's future.get(5, SECONDS) behind spawn; routerInlet.route is a
# fire-and-forget enqueue), and JUnit's TimeoutException carries the
# interceptor's own stack -- the two java.util.ArrayList.forEach frames CI
# printed -- never the blocked test thread's.
#
# So the only thing that can name the blocked frame is a dump taken while the
# thread is still blocked. junit.jupiter.execution.timeout.threaddump.enabled
# (JUnit 5.12+) makes the engine's built-in PreInterruptThreadDumpPrinter dump
# every thread's stack immediately *before* it interrupts the timed-out test
# thread, straight into the CI log. It costs nothing on a passing run: the
# printer only ever fires on a timeout, which is already a failure.
#
# Scoped to :inspect deliberately -- it is the module with the open undiagnosed
# hang. Widen it to the shared convention in buildSrc if another module needs
# the same evidence.
junit.jupiter.execution.timeout.threaddump.enabled = true
