# Capture a thread dump at the moment a :inspect test hits the 5-minute method
# timeout, instead of only learning that it did.
#
# Why this module, and why this property (computenet-8ru.3):
#
# InspectorErrorsTest > "routerInlet routing failures dead-letter host-wide"
# hung for exactly 5 minutes on CI run 31297641980 (2026-08-09 06:04:19Z) and
# has never reproduced locally. The CI log localises the stall precisely --
# :wire:test had already FAILED at 05:59:09Z and the build runs without
# --continue, so Gradle started no further tasks; the last in-flight one
# (:kernel:compileTestKotlin) flushed at 05:59:28Z, leaving the :inspect test
# JVM alone, and the build emitted nothing at all for 4m51s before resuming at
# full speed at 06:04:19Z -- but it cannot localise it
# *in the JVM*: every wait reachable from that method body is bounded well
# under 5 minutes (5s SSE attach, 10s frame await, and VirtualThreadScheduler
# .await's future.get(5, SECONDS) behind spawn; routerInlet.route is a
# fire-and-forget enqueue), and JUnit's TimeoutException carries the
# interceptor's own stack -- the two java.util.ArrayList.forEach frames CI
# printed -- never the blocked test thread's.
#
# So the only thing that can name the blocked frame is a dump taken while the
# thread is still blocked. junit.jupiter.execution.timeout.threaddump.enabled
# (present in the 5.13.4 engine this repo resolves; added in 5.12) makes the
# built-in PreInterruptThreadDumpPrinter dump thread stacks immediately
# *before* it interrupts the timed-out test thread. It costs nothing on a
# passing run: the printer only ever fires on a timeout, which is already a
# failure.
#
# Two limits on what this buys, both measured against a deliberately blocked
# probe rather than assumed (review of computenet-8ru.3):
#
# 1. WHERE IT LANDS. The printer writes to the test worker's System.out, NOT
#    to the Gradle console. buildSrc sets no showStandardStreams, so the dump
#    only reaches inspect/build/test-results/test/TEST-*.xml (<system-out>) --
#    which .github/workflows/ci.yml does not upload. On CI today the dump is
#    produced and then discarded with the runner. computenet-8ru.4 is the
#    companion fix; until it lands, this property arms nothing CI can read.
# 2. PLATFORM THREADS ONLY. PreInterruptThreadDumpPrinter calls
#    Thread.getAllStackTraces(), which excludes virtual threads. A parked
#    virtual thread is verifiably absent from the output. The blocked JUnit
#    "Test worker" is a platform thread and IS captured with its full test-
#    method frame -- that is the artefact this bead wanted -- but every
#    ManagedHost VirtualThreadScheduler thread is invisible here. If the dump
#    shows the test thread waiting on something that never completes, the
#    thing it is waiting FOR will likely need jcmd Thread.dump_to_file (which
#    does include virtual threads), not this.
#
# Cheaper than either: the TimeoutException already carries a SUPPRESSED
# InterruptedException holding the blocked thread's real stack, whenever the
# wait was interruptible. Gradle's console stack filter drops the suppressed
# section unconditionally (confirmed locally: present in the XML, absent from
# the same run's console), so its absence from CI's log for run 31297641980
# says nothing about the CI thread -- it is the same discarded-artefact
# problem as (1), not evidence of an uninterruptible wait.
#
# Scoped to :inspect deliberately -- it is the module with the open undiagnosed
# hang. Widen it to the shared convention in buildSrc if another module needs
# the same evidence.
junit.jupiter.execution.timeout.threaddump.enabled = true
