\* MODULE MCFrontierCut
\* BS-8: a fresh source epoch is announced before its first delta.
\* P05 is deliberately absent: its unchanged consequent recognizes release
\* only, while ReBaseline resolves superseded pending waves without releasing
\* them.  Listing P05 would contradict both that rule and this task's ban on
\* changing P05; the task report records the observed temporal counterexample.
SPECIFICATION CutSpec
CONSTANTS
    Sources = {"A", "A2"}
    Cells = {"A", "B", "C", "D"}
    Edges = {"ab", "ac", "bd", "cd"}
    From <- OpenLateFrom
    To <- OpenLateTo
    WaveBound = 2
    EmitFrom = {"A"}
    MayAbsorb = {}
    AbsorbAck = TRUE
    Fifo = TRUE
    LateEdges = {}
    CutEdges = {}
    Frontier = {"D"}
    Carries <- RestartCarries
    IgnoreArm = {}
    WatermarkByMax = TRUE
    FloorIgnored = FALSE
    CloseIgnored = FALSE
    Restarts = 1
    Owner <- RestartOwner
    Successor <- RestartSuccessor
    FreshEpochIds = TRUE
    AnnounceRestart = TRUE
    Swappable = {}
    SwapEmitsMarker = FALSE
    CountBaselines = FALSE
INVARIANTS P01 P02 P04 P13
PROPERTY P12
