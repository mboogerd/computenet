\* MODULE MCFrontierCut
\* EXPECT Error: Invariant P01 is violated.
\* OBSERVED Error: Invariant P01 is violated.
\* P17 control: admitting the link baseline as a delta advances the new arm's
\* watermark past waves that arm never delivered, so a wave releases torn.
\* P04, P09, P15 and P16 are also violated when listed alone; P01 is the
\* epic's target (a torn release) and is the one property this control lists.
SPECIFICATION CutSpec
CONSTANTS
    Sources = {"A"}
    Cells = {"A", "B", "C", "D"}
    Edges = {"ab", "ac", "bd", "cd"}
    From <- OpenLateFrom
    To <- OpenLateTo
    WaveBound = 3
    EmitFrom = {"A"}
    MayAbsorb = {}
    AbsorbAck = TRUE
    Fifo = TRUE
    LateEdges = {"cd"}
    CutEdges = {}
    Frontier = {"D"}
    Carries <- OpenLateCarries
    IgnoreArm = {}
    WatermarkByMax = TRUE
    FloorIgnored = FALSE
    CloseIgnored = FALSE
    Restarts = 0
    Owner <- IdentityOwner
    Successor <- IdentitySuccessor
    FreshEpochIds = TRUE
    AnnounceRestart = TRUE
    Swappable = {}
    SwapEmitsMarker = FALSE
    CountBaselines = TRUE
INVARIANT P01
