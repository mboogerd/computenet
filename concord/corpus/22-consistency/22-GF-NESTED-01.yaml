# Concord corpus scenario (W3-1). Canonical schema shape — see concord/schema/scenario.md.
# DISPUTE (see concord/corpus/DISPUTES.md): this scenario exists to assert
# glitch-freedom composing across a NESTED fork-join (22-GF-02) — two inner
# diamonds (each summing two identity arms of the same source) whose sums feed
# an outer combine. W3-4 wired `glitch-free: true` to a downstream GlitchFreeCell,
# but the composition is built from scalar `combine-latest fn:sum`
# (ScalarSumCombineCell), which is order-independent at quiescence yet NOT
# wave-aligned: it emits a CounterDelta per arm and GlitchFreeCell replays
# per-invocation, so a torn intermediate sum is still observable (same gap
# 22-GF-DIAMOND-01 narrows around, one nesting level deeper — a wave-coalescing
# scalar combine is a kernel gap). `observations-all-satisfy` stays commented out;
# only final-view is asserted today.
id: 22-GF-NESTED-01
title: Glitch-freedom composes across a nested fork-join (double diamond)
covers: [22-GF-02]
profile: core
kind: example
narrative:
  given: one counter source forked into two inner diamonds (each summing two identity arms), whose sums feed an outer combine
  when: the source is incremented repeatedly
  then: every observed outer total is a whole multiple of the fan-out factor — no observation mixes arms
    across a wave, at either nesting level
graph:
  cells:
    - {id: n, type: counter-source}
    - {id: l1, type: map, fn: identity}
    - {id: r1, type: map, fn: identity}
    - {id: s1, type: combine-latest, fn: sum, glitch-free: true}
    - {id: l2, type: map, fn: identity}
    - {id: r2, type: map, fn: identity}
    - {id: s2, type: combine-latest, fn: sum, glitch-free: true}
    - {id: s3, type: combine-latest, fn: sum, glitch-free: true}
    - {id: v, type: value-view}
  links:
    - {from: n, to: l1}
    - {from: n, to: r1}
    - {from: l1, to: s1, inlet: left}
    - {from: r1, to: s1, inlet: right}
    - {from: n, to: l2}
    - {from: n, to: r2}
    - {from: l2, to: s2, inlet: left}
    - {from: r2, to: s2, inlet: right}
    - {from: s1, to: s3, inlet: left}
    - {from: s2, to: s3, inlet: right}
    - {from: s3, to: v}
script:
  - {type: apply, on: n, op: increment, times: 50}
checks:
  # Narrowed to what the driver can honor today (P2/P7: narrow the scenario,
  # never weaken the evaluator). The real assertion this scenario exists to make
  # — every observed value on v's stream is divisible by 4 (each increment fans
  # out over 4 identity arms into two inner diamonds and one outer diamond), i.e.
  # no observation mixes arms across a wave at either nesting level (22-GF-02) —
  # is commented out below; see DISPUTES.md:
  #   - {type: observations-all-satisfy, view: v, fn: <TBD: needs a mod-eq(4,0)-shaped predicate already in the catalog, but no wave-aligned binding to observe it against>}
  - {type: final-view, view: v, equals: 200}
