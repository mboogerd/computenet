# Concord corpus scenario (W3-1, wiring landed W3-4). Canonical schema shape —
# see concord/schema/scenario.md.
# NOTE (see DISPUTES.md): `glitch-free: true` is now HONOURED — the W3-4 driver
# routes this operator's output through a downstream kernel GlitchFreeCell
# (GlitchFreeOperatorSuiteTest construction), so the wave-alignment gate is real
# and correctness-preserving (this scenario's `incremental-equals-batch` /
# `no-dead-letters` pass *through* that wrapper). What is still NOT expressible is
# the positive stream assertion: `observations-all-satisfy` over a SET stream
# needs a per-wave (set-shaped) predicate absent from the frozen function catalog,
# and a scalar even/mod invariant would need a wave-COALESCING operator (one delta
# per completed wave) — the kernel operators emit incrementally and GlitchFreeCell
# replays per-invocation, so an observer still folds each element separately. That
# is a kernel gap, not driver wiring (see DISPUTES.md). Narrowed accordingly
# (P2/P7: narrow the scenario, never weaken the evaluator).
id: 22-WAVE-FANIN-01
title: A multi-inlet fan-in over a forked source exposes only whole waves
covers: [22-GF-01]
profile: core
kind: example
narrative:
  given: one set source forked through two identity arms into a 2-of-2 fan-in quorum, observed through a set view
  when: the source is repeatedly added to and removed from
  then: at quiescence the view equals the batch fold of the source's accepted ops — the fan-in exposes
    only whole waves, never a torn (single-arm) partial delivery
graph:
  cells:
    - {id: s, type: set-source, of: string}
    - {id: l, type: map, fn: identity}
    - {id: r, type: map, fn: identity}
    - {id: q, type: quorum-set, k: 2, glitch-free: true}
    - {id: v, type: set-view}
  links:
    - {from: s, to: l}
    - {from: s, to: r}
    - {from: l, to: q}
    - {from: r, to: q}
    - {from: q, to: v}
script:
  - {type: apply, on: s, op: add, value: apple}
  - {type: apply, on: s, op: add, value: pear}
  - {type: apply, on: s, op: add, value: plum}
  - {type: apply, on: s, op: remove, value: apple}
checks:
  # The glitch-free wrapper is now wired (W3-4) and the checks below pass through
  # it. The real positive assertion this scenario exists to make — every
  # observation on v's stream reflects a whole wave from s, never a partial
  # (single-arm) delivery (22-GF-01) — is an `observations-all-satisfy` over the
  # fan-in's observation stream, still commented out: it needs a set-shaped
  # per-wave predicate the frozen function catalog does not expose (the scalar
  # even/mod/eq predicates return false on a set observation), and a scalar recast
  # would need a wave-coalescing operator (kernel gap). See DISPUTES.md.
  #   - {type: observations-all-satisfy, view: v, fn: <needs a per-wave set predicate not in the function catalog>}
  - {type: final-view, view: v, equals: [pear, plum]}
  - {type: incremental-equals-batch, view: v}
  - {type: no-dead-letters}
