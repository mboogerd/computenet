# Concord corpus scenario (W3-1, wiring landed W3-4, positive assertion
# restored R2-A). Canonical schema shape — see concord/schema/scenario.md.
# NOTE (see DISPUTES.md): `glitch-free: true` is HONOURED — the W3-4 driver
# routes this operator's output through a downstream kernel GlitchFreeCell
# (GlitchFreeOperatorSuiteTest construction), so the wave-alignment gate is real
# and correctness-preserving (this scenario's `incremental-equals-batch` /
# `no-dead-letters` pass *through* that wrapper). The positive stream assertion
# — "every observation on v's stream reflects a whole wave from s, never a
# torn (single-arm) partial delivery" — is now expressible: `quorum-set` is a
# real kernel glitch-free operator (`QuorumSetCell`, `civictech.cell.data.op`):
# its own `evaluate()` only calls `propagate()` once an element's live-lane
# count *meets* the k=2 threshold, so a single-arm delivery never reaches the
# outlet at all (verified — see DISPUTES.md investigation note). The
# `observations-whole-waves` check (R2-A, `schema/Check.kt` /
# `check/Checks.kt`) makes this assertable: every value on v's stream must
# equal `s`'s own add/remove fold at some *whole* prefix of its accepted ops —
# a torn delivery could never be such a prefix.
id: 22-WAVE-FANIN-01
title: A multi-inlet fan-in over a forked source exposes only whole waves
covers: [22-GF-01]
profile: core
kind: example
narrative:
  given: one set source forked through two identity arms into a 2-of-2 fan-in quorum, observed through a set view
  when: the source is repeatedly added to and removed from
  then: at quiescence the view equals the batch fold of the source's accepted ops — the fan-in exposes
    only whole waves, never a torn (single-arm) partial delivery
graph:
  cells:
    - {id: s, type: set-source, of: string}
    - {id: l, type: map, fn: identity}
    - {id: r, type: map, fn: identity}
    - {id: q, type: quorum-set, k: 2, glitch-free: true}
    - {id: v, type: set-view}
  links:
    - {from: s, to: l}
    - {from: s, to: r}
    - {from: l, to: q}
    - {from: r, to: q}
    - {from: q, to: v}
script:
  - {type: apply, on: s, op: add, value: apple}
  - {type: apply, on: s, op: add, value: pear}
  - {type: apply, on: s, op: add, value: plum}
  - {type: apply, on: s, op: remove, value: apple}
checks:
  - {type: final-view, view: v, equals: [pear, plum]}
  - {type: incremental-equals-batch, view: v}
  - {type: observations-whole-waves, view: v, source: s}
  - {type: no-dead-letters}
