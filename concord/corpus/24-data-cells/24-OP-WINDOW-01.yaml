id: 24-OP-WINDOW-01
title: Tumbling window folds event time into a composite group key (windows never close)
covers: [24-OP-WINDOW-01, 24-OP-WINDOW-02]
profile: core
kind: example
narrative:
  given: a set source of [event-time, value] pairs windowed into 10-wide tumbling buckets, summed per bucket, observed through a count view
  when: a late element arrives after its later-time neighbour, and one earlier element is later retracted
  then: the window is a pure function of event time alone (no wall clock, M11.6) — a late element is an ordinary add and a retraction flows into the window aggregate, exactly as any other group-by view
graph:
  cells:
    - {id: a, type: set-source}
    - {id: w, type: window, agg: sum, window: {kind: tumbling, size: 10}}
    - {id: v, type: count-view}
  links:
    - {from: a, to: w}
    - {from: w, to: v}
script:
  - {type: apply, on: a, op: add, value: [3, 5]}
  - {type: apply, on: a, op: add, value: [17, 7]}
  - {type: apply, on: a, op: add, value: [8, 2]}
  - {type: apply, on: a, op: remove, value: [3, 5]}
checks:
  - {type: final-view, view: v, equals: {"0": 2, "10": 7}}
  - {type: incremental-equals-batch, view: v}
  - {type: no-dead-letters}
