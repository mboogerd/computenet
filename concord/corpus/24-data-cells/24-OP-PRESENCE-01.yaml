# Real semantic finding (W3-2): `PresenceCountCell` (kernel/.../data/
# PresenceCountCell.kt) is a per-element FAN-IN lane counter sharing its
# substrate (`PresenceLanes`) with `QuorumSetCell` — it emits `MapDelta<E, Int>`
# keyed by element, one entry per element counting how many distinct LIVE
# SOURCE LINKS currently assert it (group-death when a count drops to 0), not a
# single scalar over one source. A scalar `value-view` on a single set-source
# (mirroring `count`) is simply the wrong shape for what the kernel builds.
# This scenario uses the real fan-in shape (two set sources) and a `map-view`.
# Resolved (DISPUTES.md `24-OP-PRESENCE-01`, oracle-gap): `BatchOracle`
# (civictech.concord.oracle.BatchOracle.presenceCountFold) now models
# `presence-count` as this same per-element live-source-link count fold, so
# `incremental-equals-batch` is restored below rather than narrowed.
id: 24-OP-PRESENCE-01
title: Presence-count emits, per element, how many live source links currently assert it
covers: [21-PROP-01]
profile: core
kind: example
narrative:
  given: two set sources fanned into a presence-count, observed through a map view
  when: one element is added on both sources and another only on one, then the shared source drops its own copy
  then: each element's count is exactly its number of asserting live source links; a count reaching zero removes the element from the view (group-death)
graph:
  cells:
    - {id: a, type: set-source, of: string}
    - {id: b, type: set-source, of: string}
    - {id: pc, type: presence-count}
    - {id: v, type: map-view}
  links:
    - {from: a, to: pc}
    - {from: b, to: pc}
    - {from: pc, to: v}
script:
  - {type: apply, on: a, op: add, value: p}
  - {type: apply, on: a, op: add, value: q}
  - {type: apply, on: b, op: add, value: p}
  - {type: apply, on: a, op: remove, value: q}
checks:
  - {type: final-view, view: v, equals: {p: 2}}
  - {type: incremental-equals-batch, view: v}
  - {type: no-dead-letters}
