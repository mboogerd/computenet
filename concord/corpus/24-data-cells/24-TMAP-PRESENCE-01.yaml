# Concord corpus scenario (KE1-F4, computenet-j2x.4.3). Canonical schema — see
# concord/schema/scenario.md.
#
# [24-TMAP-02]: a key is present iff it has at least one live dot — add-wins.
# The observable half of "iff" a single-stream scenario can state is the absence
# half: after a `remove` covers every dot the writer observes live at k1, k1 must
# be **absent from the folded map entirely** — not present carrying a null, not an
# empty entry. `final-view` compares the whole map, so an entry that reappeared
# under any rendering would fail the golden rather than pass unnoticed.
#
# Deliberately no null map values anywhere: `TaggedMapView.apply` can miss a
# null-valued put and leave the key present (known residual computenet-4d8k), and
# a scenario that used one would be asserting that behaviour as correct. The
# neutral Value vocabulary offers no null map value to state it with in any case.
#
# The add-wins half proper — a key live because a *concurrent* put's dot was not
# covered — is not stated here: it needs two writers with controlled dot order,
# which the schedule sweep does not give (concord/corpus/DISPUTES.md, KE1-37).
# 24-TMAP-MERGE-01 exercises the concurrent shape as convergence, without
# predicting which dot survives.
id: 24-TMAP-PRESENCE-01
title: A removed key is absent from the OR-map fold, not present-with-null
covers: [24-TMAP-02]
profile: core
kind: example
narrative:
  given: an ormap-source observed through a tagged-map-view
  when: two keys are put and one of them is removed
  then: the view holds only the key that still has a live dot; the removed key is absent from the map altogether
graph:
  cells:
    - {id: om, type: ormap-source}
    - {id: v, type: tagged-map-view}
  links:
    - {from: om, to: v}
script:
  - {type: apply, on: om, op: put, value: [k1, alpha]}
  - {type: apply, on: om, op: put, value: [k2, beta]}
  - {type: apply, on: om, op: remove, value: k1}   # covers k1's only live dot ⇒ no live dot ⇒ not present
checks:
  - {type: final-view, view: v, equals: {k2: beta}}
  - {type: incremental-equals-batch, view: v}
  - {type: no-dead-letters}
