# This scenario drives the PLAIN (non-`glitch-free`) scalar `combine-latest`:
# two genuinely independent inlets summed into one value. Its binding
# (`ScalarSumCombineCell`) folds each arm's arrival straight into the running
# sum, so it is order-independent at quiescence — `final-view` holds under every
# schedule — but deliberately NOT wave-aligned: across a *fork* an observer can
# transiently fold a torn intermediate sum, which is what the `CTL-GF-01`
# control pins. That is now documented semantics of this form, not a kernel gap:
# the wave-aligned form exists (D-COMBINE's `CoalescingCombineCell`), is selected
# by `glitch-free: true`, and carries the positive stream-level assertion
# (`observations-all-satisfy(even)` over a real fork-join diamond) in the
# companion scenario **24-OP-COMBINE-02**. `covers:` names the general accepted-op
# convergence property (21-PROP-01) — chapter 24 has no EARS id dedicated to
# `combine-latest` itself.
id: 24-OP-COMBINE-01
title: Combine-latest sums the latest value of each independent inlet (the plain, non-wave-aligned form)
covers: [21-PROP-01]
profile: core
kind: example
narrative:
  given: two counter sources combined by sum, observed through a value view
  when: each counter is incremented independently
  then: at quiescence the combined view equals the sum of both counters' final totals
graph:
  cells:
    - {id: n1, type: counter-source}
    - {id: n2, type: counter-source}
    - {id: s, type: combine-latest, fn: sum}
    - {id: v, type: value-view}
  links:
    - {from: n1, to: s, inlet: left}
    - {from: n2, to: s, inlet: right}
    - {from: s, to: v}
script:
  - {type: apply, on: n1, op: increment, value: 30}
  - {type: apply, on: n2, op: increment, value: 12}
checks:
  - {type: final-view, view: v, equals: 42}
