id: 24-OP-GROUPBY-01
title: Group-by folds a tagged set stream into per-key counts (default aggregator)
covers: [24-OP-GROUPBY-01, 24-AGG-01]
profile: core
kind: example
narrative:
  given: a set source of [key, value] pairs grouped by key, observed through a count view
  when: two elements share one key and one element holds another key
  then: each group's count is a deterministic function of current membership — the default `agg`
