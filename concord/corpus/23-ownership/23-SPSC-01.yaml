# Concord corpus scenario (W4-A followup, profile: core). Canonical schema —
# see concord/schema/scenario.md. Resolves the `23-SPSC-01` schema-gap with both
# halves of the kernel's M5.6/I-20 rule: the source's outlet genuinely carries
# an `Owned` payload; the Observe link is installed through the kernel's own
# `FanOutlet.tap` path and admitted without consuming the exclusive slot; its
# endpoint borrows the payload and counts the observation; and a second Consume
# link is refused by `FanOutlet.linkTo`. A push after the tap attaches proves the
# tap observes without stealing from the sole consumer. None of these outcomes
# is a driver-side simulation.
id: 23-SPSC-01
title: An observe tap is admitted beside the sole consumer of an exclusive outlet
covers: [12-EXCL-01]
profile: core
kind: example
narrative:
  given: an exclusive-outlet source already linked to its sole consumer
  when: a borrowing observe tap attaches, a second consumer is rejected, and another payload is pushed
  then: the tap observes without taking the payload or its exclusive slot, and the sole consumer still receives it
graph:
  cells:
    - {id: src, type: exclusive-source}
    - {id: c1, type: exclusive-sink}
    - {id: tap, type: exclusive-observer}
    - {id: c2, type: exclusive-sink}
  links:
    - {from: src, to: c1}
script:
  - {type: apply, on: src, op: push, value: still-flows}
  - {type: quiesce}
  - {type: connect, from: src, to: tap, role: observe, expect: connected}
  - {type: connect, from: src, to: c2, expect: rejected}
  - {type: apply, on: src, op: push, value: observed-and-consumed}
  - {type: quiesce}
checks:
  - {type: final-view, view: c1, equals: 2}
  - {type: final-view, view: tap, equals: 1}
  - {type: no-dead-letters}
