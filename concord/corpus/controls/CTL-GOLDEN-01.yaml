# Concord pilot CONTROL scenario (W0). kind: control — it MUST fail; the runner
# (W2) asserts its failure (Concord P7 — the harness must be able to fail).
# Correct graph, deliberately wrong final-view golden.
id: CTL-GOLDEN-01
title: Control — correct union graph with a deliberately wrong final-view golden
# Covers the union requirement whose final-view this control deliberately gets
# wrong (P7 — the harness must be able to fail). A real, non-dangling covers id
# keeps the concordance orphan/dangling lints clean; the wrongness is in the
# golden below, not in the lineage.
covers: [24-OP-UNION-01]
profile: core
kind: control
narrative:
  given: the same union graph as 24-OP-UNION-01, wired correctly
  when: the same adds are applied
  then: the deliberately wrong golden makes final-view fail — the runner asserts this control fails
graph:
  cells:
    - {id: a, type: set-source, of: string}
    - {id: b, type: set-source, of: string}
    - {id: u, type: union}
    - {id: v, type: set-view}
  links:
    - {from: a, to: u, inlet: left}
    - {from: b, to: u, inlet: right}
    - {from: u, to: v}
script:
  - {type: apply, on: a, op: add, value: apple}
  - {type: apply, on: b, op: add, value: pear}
checks:
  - {type: final-view, view: v, equals: [this, is, deliberately, wrong]}
# The failure this control exists to provoke (computenet-dqy.21). Asserting only
# that *something* failed would let this control keep passing the gate while
# failing for an unrelated reason — a broken union graph, a view that read
# nothing — with its real coverage silently gone. The fragment names the correct
# union the graph must still produce, so what stays pinned is "wrong golden over
# a correct graph", not merely "final-view was unhappy".
expect-failure:
  check: final-view
  message-contains: 'but read [apple,pear]'
