# Concord CONTROL scenario (W3-3; retired as a gap sentinel and reframed by
# D-CONCORD, wave B2). kind: control — it MUST fail; the runner asserts its
# failure (Concord P7 — the harness must be able to fail).
#
# The wrongness is in the EXPECTATION, exactly as CTL-GOLDEN-01's is in its
# golden: the graph asks for the PLAIN scalar `combine-latest` — the form
# `cell-catalog.md` documents as order-independent at quiescence but NOT
# wave-aligned — and then asserts wave-aligned semantics of it
# (observations-all-satisfy even) over a fork-join diamond, where a genuinely
# torn (odd) intermediate sum surfaces on at least one run of the sweep.
#
# This is no longer a KERNEL-GAP sentinel. A wave-coalescing scalar combine
# exists (D-COMBINE's `CoalescingCombineCell`); a scenario asks for it with
# `glitch-free: true`, and `24-OP-COMBINE-02` asserts this very invariant
# positively over the same diamond. What this control now pins is that asking
# for the plain form and expecting the aligned one really does fail — i.e. that
# the two forms are observably different, and that the harness catches it.
id: CTL-GF-01
title: Control — wave-aligned semantics asserted of the plain, non-wave-aligned combine
covers: [22-GF-01]
profile: core
kind: control
narrative:
  given: one counter source forked through two identity arms into the plain summing combine, which is documented as NOT wave-aligned
  when: the source is incremented repeatedly
  then: an observer sees a torn (odd) intermediate sum on some run — the deliberately mismatched even-only assertion
    fails, and the runner asserts this control fails (the aligned form, asked for with glitch-free, is 24-OP-COMBINE-02)
graph:
  cells:
    - {id: n, type: counter-source}
    - {id: l, type: map, fn: identity}
    - {id: r, type: map, fn: identity}
    - {id: s, type: combine-latest, fn: sum}
    - {id: v, type: value-view}
  links:
    - {from: n, to: l}
    - {from: n, to: r}
    - {from: l, to: s, inlet: left}
    - {from: r, to: s, inlet: right}
    - {from: s, to: v}
script:
  - {type: apply, on: n, op: increment, times: 50}
checks:
  - {type: observations-all-satisfy, view: v, fn: even}
# The failure this control exists to provoke (computenet-dqy.21), and the reason
# this block exists at all. `observations-all-satisfy` has two ways to fail: an
# observed odd (torn) sum — the one this control is written around — and its
# vacuity guard, which fails an EMPTY observation log (computenet-qaz). The two
# are indistinguishable to an assertion that only asks whether the control
# failed, so a stream that stopped being recorded would leave this control
# failing, green on the gate, and no longer testing torn-sum detection at all.
# The predicate wording pins the first, not the second. The event index and value
# vary with the schedule sweep, so only the suffix is stable — and only the
# suffix needs to be.
expect-failure:
  check: observations-all-satisfy
  message-contains: fails the predicate
