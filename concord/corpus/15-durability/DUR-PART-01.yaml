# The journal codec carries scalar elements, not list-valued ones, so this
# scenario deliberately uses scalar integers. With `key-of`, each scalar is
# its own group key and the observable board is one count per element: the
# recovery interaction, not key-function variety, is what this scenario pins.
#
# There is no snapshot step. PartitionedCell is not Stateful on this baseline,
# so the journaled composite recovers by whole-tail replay into a rebuilt cell
# under its recorded ref. If PartitionedCell later becomes Stateful, checkpoint
# recovery remains a separate scenario rather than changing this one.
#
# Recovery can deliver the pre-crash partition input by two routes: replaying
# the journaled source re-emits its set delta through the rebuilt link, and the
# partition's own journaled inlet frames replay directly. The organelles' tag
# algebra makes the overlap idempotent; equality with the uninterrupted twin
# proves that the replay neither loses nor double-counts the scalar keys.
id: DUR-PART-01
title: A journaled partition recovers by tail replay to the uninterrupted batch board
covers: [24-DUR-02, 24-PART-03]
profile: dur
kind: example
narrative:
  given: >
    a journaled set source feeding a journaled partition and volatile count
    view on the durable host, plus an uninterrupted partitioned twin driven by
    the identical scalar-element history
  when: >
    five elements reach both graphs, the durable host crashes and rebuilds the
    partition under its recorded ref by whole-tail replay, then both graphs
    accept one more element
  then: >
    the recovered volatile board equals the uninterrupted twin, the twin equals
    the independent batch oracle, and no replay route produces a dead letter
graph:
  cells:
    - {id: ds, type: journal-set-source, host: dur}
    - {id: dp, type: partition, fn: key-of, journal: default, host: dur}
    - {id: dv, type: count-view, host: dur}
    - {id: ctl, type: journal, host: dur}
    - {id: ts, type: set-source, host: twin}
    - {id: tp, type: partition, fn: key-of, host: twin}
    - {id: tv, type: count-view, host: twin}
  links:
    - {from: ds, to: dp}
    - {from: dp, to: dv}
    - {from: ts, to: tp}
    - {from: tp, to: tv}
script:
  - {type: apply, on: ds, op: add, value: 1}
  - {type: apply, on: ts, op: add, value: 1}
  - {type: apply, on: ds, op: add, value: 2}
  - {type: apply, on: ts, op: add, value: 2}
  - {type: apply, on: ds, op: add, value: 3}
  - {type: apply, on: ts, op: add, value: 3}
  - {type: apply, on: ds, op: add, value: 4}
  - {type: apply, on: ts, op: add, value: 4}
  - {type: apply, on: ds, op: add, value: 5}
  - {type: apply, on: ts, op: add, value: 5}
  - {type: quiesce}
  - {type: despawn, on: ctl}
  - {type: quiesce}
  - {type: apply, on: ds, op: add, value: 6}
  - {type: apply, on: ts, op: add, value: 6}
  - {type: quiesce}
checks:
  - {type: views-converge, views: [dv, tv]}
  - {type: incremental-equals-batch, view: tv}
  - {type: no-dead-letters}
