# WHY THIS IS STILL TWO SUBGRAPHS, and why that is no longer the reason it says
# below (computenet-yh6.1.5.2, `[KFX-23]`).
#
# The two-subgraph split was originally load-bearing: a journaled source feeding an
# `Effectful` sink DOUBLE-FIRED on recovery, because the replayed re-emission carried
# a freshly-minted random outlet identity the sink's restored frontier could not
# match. That is fixed (`34892d9`, `24-DUR-04` ref-derived outlet identity) and the
# boundary is retired — see `concord/corpus/DISPUTES.md`'s G-59/C-9 entry, which the
# corpus asserts head-on in `DUR-SRCID-01`/`DUR-SRCID-02`. So the split is NOT kept
# because the folded shape misbehaves.
#
# The fold was attempted here and measured, not argued about. Folded to one subgraph
# — this file's `journal-set-source` feeding BOTH the data view and the effect-sink,
# so one replayed emission stream is re-applied idempotently at the view and
# suppressed as already-acted at the sink at once — the durability half passes 20 of
# 20 runs (`effect-count(esink, exactly: 1)`, `no-dead-letters`). What fails, 20 of
# 20, is `incremental-equals-batch(dview)`: `source type 'journal-set-source' has no
# oracle fold`. The harness-side `BatchOracle.sourceFold` models `set-source` and not
# its durable binding, so a view fed by a journaled source has no batch oracle to be
# compared against (`DUR-SNAPTAIL-01` sidesteps the same gap by asserting
# `views-converge` against a twin). Since `incremental-equals-batch` is exactly how
# this scenario carries the `24-DUR-01`/`24-DUR-02` data-recovery half, folding would
# trade a durability assertion for nothing.
#
# So: shape retained for a harness reason, not a kernel one. Teaching the oracle the
# durable set bindings and re-attempting the fold is `computenet-yh6.1.9`.
#
# Exactly-once here is a statement about the in-process effect log this driver's
# `effect-sink` writes. The external actuator's idempotency is 93 I-7's stated
# ceiling and CON1's territory (`[KFX-24]`); nothing in this file claims it.
id: DUR-REPLAY-01
title: Crash, journal replay, and continue — the data view converges to batch and the effectful sink fires once per key
covers: [24-DUR-01, 24-DUR-02, 24-DUR-05]
profile: dur
kind: example
narrative:
  given: >
    a durable host carrying two independent subgraphs — a data source feeding a
    view, and a (volatile) source feeding a journaled effectful sink whose every
    added element fires one externally-observed effect — plus a journal
    controller. The effectful sink journals a processed-frontier per applied
    invocation (spec 24-DUR-05); the data view is recovered from its own
    pre-crash snapshot (the checkpoint half of durable recovery).
  when: >
    after some adds on both subgraphs, the whole durable host crashes and is
    rebuilt from its surviving journal (recoverFrom replays the frame tail), then
    more adds are applied and the graph is driven to quiescence
  then: >
    the data view equals the batch fold of every add it accepted, AND the
    effectful sink fired exactly once for each key — the replayed pre-crash
    invocations were dropped at or behind the sink's restored processed-frontier
    rather than re-driving the effect
graph:
  cells:
    # data subgraph — recovers its view state across the crash (raw snapshot/restore)
    - {id: dsource, type: set-source, host: dur}
    - {id: dview, type: set-view, host: dur}
    # effect subgraph — the source is VOLATILE (dies on crash, re-delivered nothing,
    # 24-DUR-03), so the sink recovers from its own journaled frames + restored
    # processed-frontier alone. NOTE (computenet-yh6.1.5.2): a volatile source is no
    # longer *required* for exactly-once here — a journaled one feeding this sink is
    # now safe (`24-DUR-04`, `DUR-SRCID-01`/`-02`). See the header comment for why the
    # shape is nevertheless kept.
    - {id: esource, type: set-source, host: dur}
    - {id: esink, type: effect-sink, host: dur}
    # the crash/restart handle: despawning it crashes and recovers the durable host
    - {id: ctl, type: journal, host: dur}
  links:
    - {from: dsource, to: dview}
    - {from: esource, to: esink}
script:
  - {type: apply, on: dsource, op: add, value: alpha}
  - {type: apply, on: dsource, op: add, value: beta}
  - {type: apply, on: dsource, op: add, value: gamma}
  - {type: apply, on: esource, op: add, value: k1}
  - {type: apply, on: esource, op: add, value: k2}
  - {type: quiesce}
  # checkpoint the volatile data view's state (its half of recovery is a snapshot)
  - {type: snapshot, on: dview, as: dv}
  # CRASH + journal replay: discard every instance, rebuild with the same refs,
  # recoverFrom the surviving journal (the sink's frontier suppresses its own frames)
  - {type: despawn, on: ctl}
  # restore the data view's pre-crash state, then continue
  - {type: restore, on: dview, from: dv}
  - {type: apply, on: dsource, op: add, value: delta}
  - {type: apply, on: esource, op: add, value: k3}
  - {type: quiesce}
checks:
  # dview accepted {alpha,beta,gamma,delta}; equals the batch oracle over dsource's ops
  - {type: incremental-equals-batch, view: dview}
  # k1,k2 fired pre-crash and were NOT re-fired on replay; k3 fired post-recovery — each
  # exactly once. Since computenet-61w the unkeyed form quantifies over the keys the script
  # FED esink (the adds on esource, the only cell linked into it: k1,k2,k3), not merely the
  # ones its log contains — so this covers the silent-effect-LOSS direction too: an element
  # suppressed to zero firings reads "observed 0, expected 1" instead of being absent from
  # the grouping and passing vacuously.
  - {type: effect-count, sink: esink, exactly: 1}
  - {type: no-dead-letters}
