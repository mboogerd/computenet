# Concord corpus scenario (computenet-ermvz.5, profile: dist). Canonical schema — see concord/schema/scenario.md.
# Deliberate schema extension: an expected authority denial is reported as a dead letter, so this scenario intentionally omits no-dead-letters.
id: 43-FLOW-AUTH-02
title: A signed transfer changes which principal may write the replicated slice
covers: [43-FLOW-04]
profile: dist
kind: example
narrative:
  given: two replicas of one slice initially owned by alice, one per host, with a local view on each
  when: alice writes and transfers the slice to bob, then bob writes and alice attempts another write
  then: the pre-transfer and new-owner values converge while alice's post-transfer value is refused and attributed to her
graph:
  hosts: [h1, h2]
  cells:
    - {id: r1, type: set-source, of: string, host: h1, replica-of: slice, authority: {principal: alice}}
    - {id: r2, type: set-source, of: string, host: h2, replica-of: slice, authority: {principal: alice}}
    - {id: v1, type: set-view, host: h1}
    - {id: v2, type: set-view, host: h2}
  links:
    - {from: r1, to: v1}
    - {from: r2, to: v2}
script:
  - {type: signed-apply, on: r1, actor: alice, op: add, value: x}
  - {type: transfer-authority, on: r1, actor: alice, to: bob}
  - {type: quiesce}
  - {type: signed-apply, on: r2, actor: bob, op: add, value: z}
  - {type: signed-apply, on: r1, actor: alice, op: add, value: w}
checks:
  - {type: replicas-converge, logical: slice}
  - {type: views-converge, views: [v1, v2]}
  - {type: final-view, view: v1, equals: [x, z]}
  - {type: final-view, view: v2, equals: [x, z]}
  - {type: write-denials, cell: r1, exactly: 1, principal: alice}
  - {type: write-denials, cell: r2, exactly: 0}
