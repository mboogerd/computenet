# Concord corpus scenario (KE1-F4, computenet-j2x.4.4, profile: dist).
# Canonical schema — see concord/schema/scenario.md.
#
# [KE1-33] (corpus half, both halves as of `computenet-j2x.4.6`):
# concord/corpus/42-replication/ gains an OR-map convergence scenario
# exercising partition/heal AND duplicate delivery,
# mirroring 42-REPL-01's idiom (two replicas of one
# logical cell, concurrent writes on both sides, convergence at quiescence)
# over `ormap-source` instead of `set-source`. Also honestly covers
# [42-REPL-04] — "replicas of one logical cell SHALL converge to equal folds
# at quiescence regardless of which replica accepted each write" is a claim
# about ANY replicated cell of the concurrent/mergeable class, not a
# set-specific one, and this scenario demonstrates it for `OrMapCell`.
#
# Partition/heal, honestly: `concord/schema/scenario.md` §Script semantics has
# no literal partition/heal/sever step — verified against the closed step
# vocabulary (`apply`, `connect`, `disconnect`, `despawn`, `read-state`,
# `retransmit`, `restart`, `restore`, `snapshot`, `quiesce`). Concurrency
# between quiesce barriers IS the corpus's partition model, exactly as
# 42-REPL-01's own header states it: steps on different cells (here, the two
# replicas r1/r2) between barriers are concurrent, and the schedule sweep
# (default 20 runs) quantifies over the delivery interleavings that would
# occur under a real network partition followed by a heal. `quiesce` at the
# end IS the heal: it is the point at which every in-flight delta has been
# gossiped and merged, which is what "the partition healed" means
# observationally.
#
# Duplicate delivery ([KE1-33]'s second half, `computenet-j2x.4.6`): the two
# `retransmit` steps after the heal barrier. Each re-delivers, at ONE replica's
# gossip inlet (`deltaInlet`), a delta the OTHER replica actually emitted —
# unchanged payload, unchanged `(source, counter)` wave position — so it is a
# genuine second arrival of an already-seen dot, not a second write. The dot is
# not faked with a second `apply` of the same value: an `apply` mints a FRESH
# dot (dot counters are per-source monotonic, minted by the emitting outlet), so
# it would exercise merge idempotence over two DISTINCT dots carrying equal
# payloads — a different, already-covered property — rather than echo-terminating
# gossip's guard against re-processing the same dot twice.
#
# `counter: 1` names each replica's FIRST minted dot, and that is deterministic
# under the schedule sweep: `OrMapCell` mints one dot per local `put`, in the
# order the script applies them, and `remove` mints none. So `(r1, 1)` is
# `put k1 from-h1` and `(r2, 1)` is `put k2 from-h2` on every run, whatever the
# delivery interleaving was.
#
# The step cannot go vacuous. The dist binding refuses loudly — it does not
# weaken to a no-op — when the named `(source, counter)` names no dot that
# replica minted, when `op:`/`value:` do not describe the recorded dot, when the
# source is not a peer replica of the same logical cell, when the inlet named is
# the write inlet rather than the gossip one, or when a `baseline:` anchor is
# stated. A typo here fails the run rather than passing over it.
#
# What this scenario asserts about the duplicate. Echo termination is invisible
# in STATE by construction: the dot algebra is idempotent, so re-absorbing an
# already-held dot changes no fold, and a tombstone already covers the very dot
# being re-delivered. The one observable difference is whether anything is
# RE-EMITTED, which is what the two `emission-count` checks below assert
# directly (`concord/schema/scenario.md` §`checks`): from just before the first
# `retransmit` (step 7, itself barrier-separated from every earlier step by the
# `quiesce` at step 6) to check time, neither replica's outlet emits anything —
# step 7 duplicates at r2's gossip inlet, step 8 at r1's, and both must
# echo-terminate. The driver-level pin stays as a second, lower-level witness:
# `concord/src/test/kotlin/civictech/concord/driver/kernel/RetransmitBindingTest.kt`
# ("a duplicate at a replica's gossip inlet re-emits nothing, where a first
# arrival re-emits once") keeps its interest-empty replica as the control that a
# zero count is termination and not a dropped injection — the corpus check and
# the driver test answer different layers.
#
# Why this is not the same OR-map scenario as `24-TMAP-MERGE-01`: that
# scenario's `profile: dist` placement is in service of stating [24-TMAP-01]'s
# merge law (order-insensitivity) through two replicas as the vehicle: its
# `covers:` is the tagged-map data-cell law. This scenario's subject is the
# opposite way round — replication's own convergence guarantee
# ([42-REPL-04]/[KE1-33]), with the OR-map as the vehicle cell type — which is
# why it lives in `concord/corpus/42-replication/` rather than
# `concord/corpus/24-data-cells/`, and why its `covers:` names the replication
# id instead of a tagged-map law id.
id: 42-TMAP-REPL-01
title: Two OR-map replicas converge under concurrent writes on both sides, including a remove racing a re-put
covers: [42-REPL-04]
profile: dist
kind: example
narrative:
  given: two ormap-source replicas of one logical OR-map, one per host, each observed through its own tagged-map-view
  when: puts land on both replicas concurrently and one side removes a key the other side concurrently re-puts
  then: at quiescence both replicas hold equal folds and both views agree — convergence, not a fixed golden
graph:
  hosts: [h1, h2]
  cells:
    - {id: r1, type: ormap-source, host: h1, replica-of: shared}
    - {id: r2, type: ormap-source, host: h2, replica-of: shared}
    - {id: v1, type: tagged-map-view, host: h1}
    - {id: v2, type: tagged-map-view, host: h2}
  links:
    - {from: r1, to: v1}
    - {from: r2, to: v2}
script:
  - {type: apply, on: r1, op: put, value: [k1, from-h1]}
  - {type: apply, on: r2, op: put, value: [k2, from-h2]}
  - {type: apply, on: r1, op: put, value: [k3, seed]}
  - {type: apply, on: r2, op: remove, value: k3}          # concurrent remove of a key the other side re-puts below
  - {type: apply, on: r1, op: put, value: [k3, revived]}  # re-put races the remove above; reset-remove decides the outcome
  - {type: quiesce}                                      # the heal: every in-flight delta is gossiped and merged
  # duplicate delivery: each replica is handed back, at its gossip inlet, a dot
  # its peer already gossiped to it — same payload, same (source, counter)
  - {type: retransmit, on: r2, source: r1, counter: 1, op: put, value: [k1, from-h1]}
  - {type: retransmit, on: r1, source: r2, counter: 1, op: put, value: [k2, from-h2]}
checks:
  - {type: replicas-converge, logical: shared}
  - {type: views-converge, views: [v1, v2]}
  - {type: no-dead-letters}
  - {type: emission-count, cell: r2, since: 7, exactly: 0}
  - {type: emission-count, cell: r1, since: 7, exactly: 0}
