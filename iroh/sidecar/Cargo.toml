[package]
name = "computenet-iroh-sidecar"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
description = "ComputeNet iroh sidecar: peer links over QUIC, dialled by endpoint id, carrying length-prefixed frames"
license = "Apache-2.0"
publish = false

# Three binaries: the sidecar itself (src/main.rs), the self-hosted relay
# (src/bin/relay.rs) CI points it at, so neither test run depends on n0's
# public relay infrastructure (computenet-o0m3), and the self-hosted pkarr
# relay + DNS server (src/bin/dns.rs) that backs LookupMode::Rendezvous
# (computenet-vnscs).
[[bin]]
name = "computenet-iroh-sidecar"
path = "src/main.rs"

[[bin]]
name = "computenet-iroh-relay"
path = "src/bin/relay.rs"

[[bin]]
name = "computenet-iroh-dns"
path = "src/bin/dns.rs"

# No iroh-gossip / iroh-docs (epic computenet-egl §3 excludes them). tokio became
# a real dependency with the bin and its local-socket protocol
# (computenet-egl.1.2): the loopback listener, the message pumps and the per-link
# tasks all live in the library so tests can drive the protocol in-process.
[dependencies]
iroh = "1.0"
# The relay server, at the same 1.0 line `iroh` already pins transitively — so
# the relay we host and the client that dials it are one version. Its `server`
# feature is what exposes `iroh_relay::server::Server`; the sidecar library
# itself never touches it, only `src/bin/relay.rs` and `tests/relay_mode.rs`.
iroh-relay = { version = "1.0", features = ["server"] }
# The self-hosted pkarr relay + DNS server that backs LookupMode::Rendezvous
# (computenet-vnscs, F2-D3/F2-D11). Only src/bin/dns.rs and
# tests/rendezvous_mode.rs use it; the library itself never imports it. A
# 1.2.0 release exists on crates.io alongside 1.0.3, but resolving against
# this crate's already-locked dependency graph (as `cargo build`/`cargo
# check` do, never discarding Cargo.lock) picks 1.0.3 for this requirement
# without moving `iroh` or any other locked package (checked directly:
# `cargo check --bin computenet-iroh-dns` with this exact "1.0" leaves
# Cargo.lock's iroh-dns-server and iroh entries at 1.0.3, byte-identical).
# Stay on the same bare "1.0" line `iroh` itself uses.
iroh-dns-server = "1.0"
# Opt-in LAN peer enumeration (aas-D3, F1-D1). Must ride on the pinned `iroh`
# 1.0.3 line without moving it — see ne2oh-B1: this resolves against 1.0.3 and
# locks 4 new packages (acto, smol_str, swarm-discovery, and itself).
iroh-mdns-address-lookup = "0.5"
# `StreamExt::next` over the mDNS subscription stream (ne2oh-B7). Already in
# the lock via that crate; `default-features = false` keeps it to the futures
# core rather than pulling an executor.
futures-util = { version = "0.3", default-features = false }
# The pkarr relay URL carried by `LookupMode::Rendezvous` (computenet-vnscs,
# F2-D1): `PkarrPublisher::builder`/`PkarrResolver::builder` take a
# `url::Url`, so the type appears in this crate's own public signature. Already
# in the lock transitively via `iroh`; naming it here adds an edge, not a
# package.
url = "2"
tokio = { version = "1", features = [
    "io-util",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "sync",
    "time",
] }
