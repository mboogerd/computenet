name: Announcement probe (on-demand Linux bulk sample)

# An INSTRUMENT, not a gate (computenet-dqy.49).
#
# What it is for. The announcement-loss family (computenet-dqy.34 / .38 / .40 /
# .44 / .47) needs a Linux sample of the announcement path at a size the fast
# lane cannot afford. The container route computenet-dqy.44 prescribes needs a
# Docker daemon, which cannot be started unattended on the dev host; a
# GitHub-hosted `ubuntu-latest` runner is the same Linux JVM with no daemon and
# no human. This job is that route.
#
# Deliberate non-properties, all of them load-bearing:
#
#   - `workflow_dispatch` ONLY. No `push`, no `pull_request`, no `schedule`. It
#     costs nothing until somebody asks for it.
#   - NOT a required check. The protected-branch ruleset requires
#     build-test-fast, build-test-serial, concord-full, ui-test, agora-ui-test,
#     kernel-test.
#     This job's name is not among them and must not be added: a probe that
#     deliberately runs the flakiest path in the repo at 100x size is the last
#     thing that should be able to block a merge.
#   - It does not touch `ci.yml`, so it cannot lengthen build-test-fast, whose
#     wall time computenet-dqy.15 and computenet-dqy.16 spent real effort on.
#
# THE TRAP THIS JOB EXISTS TO NOT FALL INTO. Gradle's Test task does not inherit
# the daemon's system properties, so before PR #81 `./gradlew :wire:test
# -Dwire.stress.iterations=100000` ran silently at the committed default of 25 —
# a small sample wearing a large sample's label, with nothing in the output
# saying so. `wire/build.gradle.kts` now forwards these keys explicitly. The
# preflight step below re-proves that forwarding IN THIS JOB, on every run, by
# poisoning each numeric key with a non-numeric value and requiring the resulting
# NumberFormatException: if the forwarding ever regresses, this job fails before
# it collects a single number rather than reporting a default-size run as a bulk
# one.
#
# This preflight is no longer the ONLY guard, and the split matters
# (computenet-piur). Because this workflow is `workflow_dispatch`-only, a
# forwarding regression used to be invisible until a human dispatched a probe —
# measured 2026-08-14: deleting the forwarding block entirely left
# `./gradlew :wire:test --tests '*WsAnnouncementStressTest*' --rerun
# -Dwire.stress.injectFailureAt=1` fully green. `WireSystemPropertyForwardingTest`
# now covers the LIST on the required `build-test-fast` lane, at no measurable
# cost: `wire/build.gradle.kts` publishes the forwarded keys into the test JVM and
# that test requires them to cover every `wire.*` key the `:wire` test sources
# read. This preflight keeps covering what a same-JVM test structurally cannot —
# that a `-D` on a Gradle COMMAND LINE actually reaches the fork — which needs a
# nested Gradle invocation and is exactly the cost `build-test-fast` should not
# pay. Neither guard subsumes the other.
#
# `wire.stress.injectFailureAt` (computenet-dqy.63) is the same trap, but its
# preflight check cannot be "poison with garbage, expect an exception": that
# property's own parser (`WsAnnouncementStressTest.parseInjectFailuresAt`) is
# deliberately tolerant — a malformed entry is dropped, not thrown, so a long
# measurement run's `-D` typo does not crash it. Poisoning it with garbage would
# therefore prove nothing: forwarding broken and forwarding fine-but-tolerant
# look identical (both green, both silent). So this key is proved the opposite
# way — forward it a REAL injection value and require the induced failure: a
# non-zero exit plus `Report.render`'s `injected synthetic failure(s)` summary
# on the console. NOT the `INJECTED SYNTHETIC FAILURE` banner the test's KDoc
# names — that one is written by `Failure.render` to the per-failure artifact
# file only, and never reaches the console this preflight greps (see the step's
# own comment below). computenet-dqy.63 also found and fixed the OTHER half of this same
# trap: the `@Test` used to not read this property at all, so even a perfectly
# forwarded value did nothing — the two failure modes look the same from here
# (a silently green run), which is exactly why this preflight exists.
#
# Two more places the sample size could quietly collapse, both guarded:
#   - `--rerun` on every probe invocation. A test task satisfied FROM-CACHE or
#     UP-TO-DATE executes nothing and still reports success.
#   - the executed-size assertions after each probe, which require the expected
#     testcase to actually appear in the JUnit XML.
#
# THE SIZE MUST FIT THE BUILD'S PER-TEST TIMEOUT (computenet-dqy.50). Every
# test method in this build gets 5 minutes
# (`junit.jupiter.execution.timeout.testable.method.default = 5m`, set in
# `buildSrc/src/main/kotlin/kotlin-jvm.gradle.kts`), so the deadline is not this
# job's to raise: it is repo-wide, argued at length there, and both probes are
# under it. A dispatched size that does not fit that deadline does not produce a
# smaller sample — it produces NO sample: the probes report
# only at the end, so the timeout throws away every iteration that did run, and
# the run reddens having measured nothing. This job's original default,
# stress_iterations=20000, was such a size. Measured, on ubuntu-latest:
#
#   run 31668681959  stress 20000  ->  TimeoutException at 300.028s, NO sample
#   run 31669727862  stress  2000  ->  PASSED,  75.468s  (37.7ms/iteration)
#   run 31669883848  stress  4000  ->  PASSED, 159.639s  (39.9ms/iteration)
#
# The 20000 run is only a bound — the log never says how far it got — so the two
# green runs are the measurement. They are slightly superlinear (~42ms marginal
# between them), so read the ceiling off the marginal cost, not the average:
# ~7,000 iterations is where a single invocation meets the deadline. The default
# is 4,000 (8,000 announcement awaits, 159.6s measured) — a little over half the
# budget, ~1.9x margin for a slower runner. That ceiling is not low enough to justify
# chunking a sample across invocations: a caller who wants more awaits dispatches
# this job again (the concurrency group deliberately does not cancel, so two
# dispatches are two independent samples). Do NOT raise that 5-minute default,
# or pin a longer `@Timeout` on the probes, to make a larger number fit — the
# deadline is what makes an unfinished run visible instead of silent.
#
# The burst probe is a separate budget: 6000 x 40 measured 269.152s on run
# 31668681959, inside the same 5 minutes but with much less headroom per
# iteration to spare.
#
# A TIMED-OUT ARM IS NOT AN OCCURRENCE. computenet-dqy.12 established for this
# repo that a JUnit 5m TimeoutException proves neither a failure of the code
# under test nor an in-JVM block. The report script therefore classifies each
# arm as clean / incomplete / loss / unrecognised and hands the verdict to the
# Conclude step through $STRESS_OUTCOME / $BURST_OUTCOME, so the job's own
# conclusion says which happened and an unfinished sample can never be read as
# a lost announcement.
#
# NOR IS A FAILURE FROM OUTSIDE THE ANNOUNCEMENT PATH (computenet-dqy.54). A
# loss is recognised positively, by the probe's own report line; a non-timeout
# failure carrying no such line is `unrecognised` — red, and counted into no
# rate — rather than an occurrence. This matters most for `load=suite` below,
# which is by construction the arm most likely to die of heap or disk pressure.
#
# THE ONE CONTROLLED COMPARISON THIS JOB CAN MAKE (computenet-dqy.52). The
# strongest lead on computenet-dqy.40 is a rate difference: 2 losses in 450
# awaits when WsAnnouncementStressTest ran inside build-test-fast, against 0 in
# 20,000 awaits when this job ran it essentially alone on the same runner class
# (runs 31669727862, 31669883848, 31670959177). Those rates are incompatible —
# at 2/450 the isolated sample predicts ~89 losses. WHAT CAUSES THE DIFFERENCE
# IS NOT MEASURED, and the comparison that produced it is uncontrolled: the two
# conditions differ in concurrent load, but also in JVM reuse, Gradle worker
# configuration, heap pressure, and how many live sockets and threads share the
# test JVM.
#
# `load` narrows that to one axis. Dispatch this job TWICE with identical sizes,
# once with `load=none` and once with `load=suite`, and the only intended
# difference is whether a second, independent copy of the repository is running
# build-test-fast's own command on the same runner while the probe runs.
#
#   ./gradlew build check -PexcludeMultiJvm=true -x :kernel:test
#
# The load runs from a COPY of the checkout under $RUNNER_TEMP with its own
# project directory and its own Gradle daemon, because two Gradle invocations
# in one project directory contend on that directory's locks — which would make
# the load block the probe rather than compete with it, and would measure the
# wrong thing. It shares $GRADLE_USER_HOME, which is the ordinary situation for
# two projects built at once on one machine.
#
# WHAT STILL DIFFERS BETWEEN THE TWO ARMS, all of it inseparable by
# construction, and none of it something a run of this job can rule out:
#
#   - CPU, memory, page cache and disk contention arrive together. This job
#     tests "concurrent suite load", NOT "CPU starvation" — no arm here can
#     separate those.
#   - The load's Gradle daemon and test JVMs consume RAM, so the loaded arm is
#     also the higher-heap-pressure arm. MEASURED on run 31673273722's sampler,
#     not assumed: this runner reports `4 cores`, MemAvailable fell from
#     14,289MB to 10,014MB while the load ramped, and java process count went
#     2 -> 8. (An earlier draft of this header said "2-core, ~7GB"; that is the
#     old hosted-runner spec and is wrong for the runner these numbers came
#     from — the contention arithmetic must use 4 cores.)
#   - The two arms share $GRADLE_USER_HOME, so they contend on Gradle's global
#     caches. build-test-fast has no such co-tenant; this is an interference
#     channel the loaded arm ADDS rather than reproduces.
#   - The load IS build-test-fast's command, and that command runs `:wire:test`
#     (neither announcement test carries the `multi-jvm` tag that
#     `-PexcludeMultiJvm=true` strips). So the loaded arm runs a SECOND copy of
#     the announcement tests, in another JVM, peering over loopback while the
#     probe peers over loopback. build-test-fast has no such concurrent
#     co-tenant on the loopback stack — there the `:wire:` tests run one after
#     another in a single JVM — so this too is a channel the loaded arm ADDS.
#     A loss appearing only in the loaded arm therefore does not separate
#     machine-level load from concurrent loopback/port co-tenancy either.
#
# WHAT NEITHER `load` ARM REPRODUCES, and this bounds what a null result there
# can mean: inside build-test-fast, WsAnnouncementStressTest runs in the SAME
# test JVM as every other `:wire:` test, after them, with their heap churn,
# their sockets and their threads. Both `load` arms run the probe alone in a
# freshly filtered `:wire:test`. If the loss lives in that in-JVM co-tenancy,
# both read clean and the load experiment refutes nothing about it — it only
# rules out (or in) the machine-level load. It ruled it OUT
# (computenet-dqy.52: 3,000 loaded awaits, 0 losses, against ~13.3 expected at
# the build-test-fast rate of 2/450, P(0)=1.6e-6), which leaves the in-JVM
# condition as the surviving candidate — and `cotenancy` below is the arm for
# it (computenet-dqy.53).
#
# THE SECOND AXIS: `cotenancy` (computenet-dqy.53). A SEPARATE knob from `load`,
# deliberately, because they ask different questions and the bead that added
# this one says so explicitly: `load` puts a second PROCESS on the machine;
# `cotenancy` is about the interior of ONE test JVM. Stretching `load` to cover
# both would have made every future dispatch's condition ambiguous.
#
#   cotenancy=filtered   (default, and what every run before 2026-08-13 did)
#     ./gradlew :wire:test --tests '*WsAnnouncementStressTest*' --rerun -D...
#     The probe is the only test class in the JVM.
#
#   cotenancy=suite-jvm
#     ./gradlew :wire:test --rerun -PexcludeMultiJvm=true -Dwire.stress.iterations=N
#     The WHOLE `:wire:` suite, one test JVM, exactly the shape build-test-fast
#     gives the probe — which is the condition under which the 2/450 losses were
#     harvested (computenet-dqy.47).
#
# Why that command reproduces the condition rather than approximating it:
#   - `:wire` has 13 test classes (counted from run 31686209748's own
#     roster, not from the source tree), far under `forkEvery(80)`, and
#     `maxParallelForks` is raised for `:kernel` ONLY, so the whole `:wire:`
#     suite runs in ONE JVM, sequentially. That is a property of
#     `buildSrc/src/main/kotlin/kotlin-jvm.gradle.kts`, not of this workflow.
#   - `-PexcludeMultiJvm=true` is build-test-fast's own flag. No `:wire:` test
#     carries `@Tag("multi-jvm")` today, so it selects the same set either way;
#     it is passed for fidelity, so the two commands cannot drift apart.
#   - The burst knobs are NOT forwarded in this mode. Under `cotenancy=suite-jvm`
#     `WsAnnouncementCatchUpBurstTest` runs as a co-tenant at its COMMITTED
#     default (10 x 40), which is what it runs at inside build-test-fast. Raising
#     it would change the co-tenant JVM into something build-test-fast never has,
#     and would also spend the wall-clock budget. `burst_iterations` must be `0`
#     in this mode for the same reason: the separate filtered burst arm answers a
#     different question and only adds minutes here.
#   - `--rerun` still applies, and the executed-size assertion still applies: the
#     report script filters the JUnit XML by class, so the 13 sibling classes'
#     testcases are ignored for the numerator and denominator.
#
# WHAT `cotenancy=suite-jvm` STILL DOES NOT REPRODUCE, stated so no null result
# here is read as bigger than it is: build-test-fast runs `build check` over
# EVERY module, so its `:wire:test` shares a runner with other modules' compile
# and test tasks (Gradle `org.gradle.parallel=true`), and its `:wire:test` runs
# at the committed `wire.stress.iterations=25` rather than a raised one. This arm
# reproduces the ONE JVM's interior — sibling classes, their threads, their
# sockets, their heap churn, in their order — not the whole lane.
#
# ORDER IS NOT ASSUMED, IT IS RECORDED. "After them" is an observation about
# build-test-fast, not something this workflow can pin: JUnit's default class
# order is neither alphabetical nor configured here. So the co-tenancy evidence
# step reads the per-class JUnit XML timestamps back and prints the roster and
# where the stress class actually fell in it. If it lands first, the run still
# measured a shared JVM but not the "after them" shape, and the roster is what
# says which happened — the same role `loadavg.log` plays for `load=suite`.
#
# A SIBLING FAILURE IS NOT AN ANNOUNCEMENT LOSS EITHER. In this mode the Gradle
# exit status covers all 13 classes, and `:wire:` has a flake history of its own. The
# report script already keys the numerator to WsAnnouncementStressTest's own
# testcase, so a sibling failure leaves the stress arm CLEAN and countable while
# the run goes red. The Conclude step says exactly that rather than implying the
# probe invocation was unusable.
#
# SIZING IT (computenet-dqy.53). The cost is NOT the loaded arm's 1.4-1.6x —
# that figure is about a competing process and does not transfer. What this arm
# adds to the stress testcase's own 5-minute budget is whatever the sibling
# classes do to the JVM it runs in; the sibling classes' own wall time is charged
# to THEIR methods, not to the probe's. That was unknown until measured, so the
# size step STARTED at 1000 stress iterations, the same conservative ceiling
# `load=suite` got, and the first dispatch was the measurement. It is now 4000 —
# read the size step, which is the authority; this paragraph says why.
# MEASURED, ubuntu-latest, `cotenancy=suite-jvm`, three dispatches
# on 2026-08-13, each an independent sample:
#
#   run 31686209748  stress  500  ->  CLEAN, probe wall time 18.978s, 1,000 awaits
#   run 31686456879  stress 1500  ->  CLEAN, probe wall time 60.198s, 3,000 awaits
#   run 31686485278  stress 1500  ->  CLEAN, probe wall time 55.839s, 3,000 awaits
#
# 7,000 co-tenant awaits, 0 losses. The per-iteration cost is 37.2-40.1ms, i.e.
# the SAME as the 38.5ms this probe costs alone — the siblings take nothing
# detectable out of its 5-minute budget, which is why the ceiling above is the
# filtered one rather than a reduced one.
#
# WHERE THE PROBE ACTUALLY FELL, from all three rosters, identically: class 3 of
# 13, with WsAnnouncementCatchUpBurstTest and WsAnnouncementSilenceInventoryTest
# before it and ten classes after. So this arm reproduces "one shared test JVM,
# twelve sibling classes", NOT "after all of them" — the phrase the bead that
# asked for it used. Two classes' churn precedes the probe here, not twelve.
# Whether build-test-fast orders them the same way is NOT verified: `ci.yml`
# uploads test XML only on `failure() || cancelled()`, so a green fast lane
# publishes no roster to compare against. The two invocations run the same task
# over the same class set, which is a reason to expect the same order, not a
# measurement of it.
#
# THE THIRD AXIS: `lane` (computenet-dqy.55). Both paragraphs above end at the
# same wall — "this arm reproduces the JVM's interior, not the whole lane", and
# "whether build-test-fast orders them the same way is NOT verified" — and
# `lane=build-check` is the arm that goes through it. It runs build-test-fast's
# own command, `build check -PexcludeMultiJvm=true -x :kernel:test`, repeated
# `lane_passes` times, forwarding NO -D so the probe runs at the committed
# `wire.stress.iterations=25`: the exact invocation, the exact size, the exact
# Gradle worker configuration the 2/450 harvest came from. It is the only arm
# for which "the same as build-test-fast" is a description rather than an
# approximation, and it prints the roster per pass, which settles the ordering
# question from the lane side.
#
# Its denominator is small per pass — 50 awaits — and that is inherent: raising
# it would stop being the lane. Power comes from passes, not from size, and the
# arithmetic is in the `lane_passes` input description. It is the one arm whose
# result is directly comparable to 2/450, because it is 2/450's own condition.
#
# `ci.yml` settles the same ordering question from the other side, and the two
# are deliberately redundant: this arm proves what the command produces on a
# runner it controls, and ci.yml's success-path `:wire:` XML upload
# (computenet-dqy.55) proves what the REAL fast lane produced on a run nobody
# staged. Both use `announcement_probe_cotenancy.py`, so a disagreement between
# them is a fact about the runs and not about two different renderings.
#
# SIZE THE LOADED ARM TO FINISH. An INCOMPLETE arm teaches nothing (see the
# timeout note above), and load makes every iteration slower, so the loaded
# ceiling is BELOW the isolated 39.9ms/iteration figure by an amount nobody has
# measured yet. The guard in the size step therefore refuses `load=suite` above
# 1000 stress iterations and 500 burst iterations. Those two ceilings are an
# EXTRAPOLATION, not a measurement: they assume load costs at most ~4x, which
# the first loaded dispatch is what actually tests.
#
# THAT ASSUMPTION HAS NOW BEEN TESTED and it held with room to spare. Loaded
# stress 500 took 27.124s (run 31673273722) and 31.639s (run 31673494600)
# against 16.64-19.255s unloaded — a 1.4-1.6x slowdown, not 4x. At the ceiling
# of 1000 that projects to ~55-65s against the 300s deadline. The ceilings are
# conservative, and it is the 4x figure, not the ceilings, that was pessimistic.
#
# The isolated control at the size intended for the loaded arm HAS been
# measured, on ubuntu-latest, run 31672139859 (`load=none`, stress 500, burst
# 500 x 40):
#
#   stress 500  ->  CLEAN, wall time 19.255s   (38.5ms/iteration, 1,000 awaits)
#   burst  500  ->  CLEAN, wall time 23.613s   (47.2ms/iteration, 20,000 refs)
#
# Both sit at ~6-15x margin against the 5-minute deadline, which is what makes
# 500/500 the right first loaded dispatch: it can absorb a large slowdown and
# still produce a sample. `burst_iterations=0` skips the burst arm entirely and
# is the fallback if even that comes back INCOMPLETE. Do NOT dispatch the
# committed defaults under load — 6000 x 40 spent 269s of the 300s budget with
# no load at all.
#
# WHAT ONE LOADED DISPATCH DELIVERS AS A DENOMINATOR: 2 awaits per iteration, so
# 500 iterations is 1,000 awaits — more than double build-test-fast's entire
# 450-await harvest, in one run. That is the point of doing it here: the fast
# lane yields 50 awaits per run, and the loaded condition is the expensive one.
# If the suite rate of 2/450 (0.444%/await) is real and load carries it, a
# single 1,000-await loaded run expects ~4.4 losses and sees zero with
# probability ~1.2%.
#
# THE REPORT MUST SURVIVE. The value of an occurrence is the full two-sided
# failure report — server localRefs vs client remoteRefs, per-ref park depths on
# both sides, and the preHello/gate silent-drop counters PR #83 added. Gradle's
# console rendering of a failed test is not a contract, so the report is
# extracted verbatim from the JUnit XML (message + text, untruncated) into the
# job log AND the step summary, and the XML itself is uploaded as an artifact.
on:
  workflow_dispatch:
    inputs:
      stress_iterations:
        description: "WsAnnouncementStressTest iterations (2 announcement awaits each; committed default is 25). MUST fit the build's 5-minute per-test JUnit timeout: measured 37.7-39.9ms/iteration on ubuntu-latest, so ~7,000 is the ceiling. Dispatch again for a bigger sample."
        required: false
        default: "4000"
      burst_iterations:
        description: "WsAnnouncementCatchUpBurstTest iterations (committed default is 10). 6000 x 40 measured 269.152s against the same 5-minute deadline — it fits, but with only ~11% headroom; go lower if a run comes back INCOMPLETE. 0 SKIPS the burst arm entirely — the fallback if 500 still comes back INCOMPLETE under load=suite."
        required: false
        default: "6000"
      burst_refs:
        description: "Refs published per burst iteration (committed default is 40)"
        required: false
        default: "40"
      load:
        description: "Concurrency condition (computenet-dqy.52). 'none' = the probe runs essentially alone. 'suite' = a separate copy of the repo runs build-test-fast's own command on the same runner throughout. Dispatch the SAME sizes under both to get a controlled pair; keep loaded sizes small (start at 500 stress / 500 burst, and drop to burst_iterations=0 if the burst arm comes back INCOMPLETE) or the loaded arm times out and measures nothing."
        required: false
        type: choice
        default: "none"
        options:
          - none
          - suite
      cotenancy:
        description: "In-JVM condition (computenet-dqy.53). 'filtered' = the probe is the only test class in the test JVM (what every run before 2026-08-13 did). 'suite-jvm' = the whole ':wire:' suite runs in ONE test JVM with the probe, build-test-fast's own shape, which is where the 2/450 losses were harvested. This is a DIFFERENT axis from 'load' (that one adds a second process; this one is one JVM's interior). Since computenet-dqy.55 the two MAY be combined — each having come back null alone, their conjunction is the next untested condition — but 'suite-jvm' still requires burst_iterations=0."
        required: false
        type: choice
        default: "filtered"
        options:
          - filtered
          - suite-jvm
      lane:
        description: "Invocation condition (computenet-dqy.55). 'task' = this job dispatches a ':wire:test' of its own, which is what every arm before 2026-08-13 did. 'build-check' = it runs build-test-fast's WHOLE command ('build check -PexcludeMultiJvm=true -x :kernel:test') lane_passes times, at the COMMITTED wire.stress.iterations=25 with no -D forwarding — the only arm that reproduces the invocation the 2/450 losses were actually harvested in. 'build-check' ignores none of the size knobs quietly: it REFUSES any dispatch whose knobs it would not honour."
        required: false
        type: choice
        default: "task"
        options:
          - task
          - build-check
      lane_passes:
        description: "lane=build-check only: how many times to run build-test-fast's command. Each pass yields 50 announcement awaits (25 committed iterations x 2). MEASURED cost: build-test-fast's own job ran 158-171s wall on ubuntu-latest (runs 31688056778 / 31688930547 / 31690041537), of which ~40s is checkout/JDK/Gradle setup this job pays once — so budget ~2-2.5 min per pass. 12 passes = 600 awaits in ~30 min. At the fast lane's own harvested rate of 2/450 awaits, 600 awaits expects ~2.7 losses and misses them entirely with probability ~7%; 450 awaits (9 passes) is the exact denominator of the harvest itself."
        required: false
        default: "12"

# No `cancel-in-progress`: a superseded run of a multi-hour measurement is
# wasted compute, and two concurrent dispatches are two independent samples,
# which is a legitimate thing to want.
#
# THEY ARE INDEPENDENT SAMPLES, NOT CONCURRENT ONES. The group is per-ref, so a
# second dispatch on the SAME ref does not run alongside the first — it sits
# `pending` until the first finishes. Observed 2026-08-13: runs 31691243326 and
# 31691272219 were dispatched 23 seconds apart on `feature/computenet-dqy.55`
# and the second waited ~19 minutes (first ended 10:47:55Z, second's first step
# ran 10:48:12Z). Budget wall time as the SUM of the dispatches, or dispatch
# from two different refs if they must overlap.
concurrency:
  group: announcement-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  announcement-probe:
    name: Announcement probe (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Same setup as every Gradle lane in ci.yml, including the
      # `cache-encryption-key` that lets setup-gradle save the configuration
      # cache (computenet-aer). Unset secret degrades to no-config-cache-save
      # rather than failing.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      # The rebuild steps below run a repo-wide `build check`, which reaches
      # :demo:beadsmirror's real-`bd` suites (computenet-mgxe, issue #304).
      - uses: ./.github/actions/install-bd-dolt

      - name: Record the requested sample size
        env:
          STRESS: ${{ inputs.stress_iterations }}
          BURST: ${{ inputs.burst_iterations }}
          REFS: ${{ inputs.burst_refs }}
          LOAD: ${{ inputs.load }}
          COTENANCY: ${{ inputs.cotenancy }}
          LANE: ${{ inputs.lane }}
          PASSES: ${{ inputs.lane_passes }}
        run: |
          set -euo pipefail
          for v in "$STRESS" "$BURST" "$REFS" "$PASSES"; do
            case "$v" in
              ''|*[!0-9]*) echo "::error::inputs must be non-negative integers; got '$v'"; exit 1 ;;
            esac
          done
          # burst_iterations=0 is the documented "skip the burst arm" value; the
          # other two knobs have no meaningful zero.
          [ "$STRESS" -gt 0 ] || { echo "::error::stress_iterations must be > 0; got '$STRESS'"; exit 1; }
          [ "$REFS" -gt 0 ] || { echo "::error::burst_refs must be > 0; got '$REFS'"; exit 1; }
          # THE LOADED CEILING IS AN EXTRAPOLATION, NOT A MEASUREMENT (see the
          # header). It exists so that flipping `load` on an otherwise default
          # dispatch fails here — in two seconds — instead of half an hour later
          # as an INCOMPLETE arm that measured nothing.
          if [ "$LOAD" = "suite" ]; then
            if [ "$STRESS" -gt 1000 ]; then
              echo "::error::load=suite with stress_iterations=$STRESS: refused. Under concurrent suite load every iteration costs more than the 39.9ms measured alone, and an arm that trips the 5-minute per-test timeout produces NO sample (computenet-dqy.12). Ceiling 1000; dispatch 500 first and read the wall time."
              exit 1
            fi
            if [ "$BURST" -gt 500 ]; then
              echo "::error::load=suite with burst_iterations=$BURST: refused. Unloaded, 6000x40 already used 269s of the 300s budget, so the burst arm has no headroom for any slowdown. Ceiling 500; pass burst_iterations=0 to skip the arm."
              exit 1
            fi
          fi
          # THE TWO AXES MAY NOW BE COMBINED (computenet-dqy.55), and the reason
          # the refusal is gone matters as much as the combination.
          #
          # computenet-dqy.53 refused `load=suite` together with
          # `cotenancy=suite-jvm` on the grounds that a run which is both
          # measures a condition nothing in the comparison chain shares, so a
          # loss in it would separate neither axis. That was the right rule
          # while either axis might still have been the answer: with both
          # untested, the conjunction cannot attribute.
          #
          # Both have since come back NULL — load at 3,000 awaits
          # (computenet-dqy.52) and co-tenancy at 7,000 (computenet-dqy.53) —
          # and the attribution argument inverts. There is nothing left for the
          # conjunction to be confounded WITH: if a loss appears only when both
          # are on, the finding is precisely that neither alone is the
          # condition and their interaction is, which is a different and now
          # reachable claim. And if it too comes back null, the two-axis
          # hypothesis is what the null closes out.
          #
          # It is still ONE cell of a 2x2, not a substitute for either margin,
          # and the ledger below labels it as such.
          if [ "$COTENANCY" = "suite-jvm" ]; then
            # The stress ceiling for the combined cell is the LOADED one, not
            # the co-tenant one: 38.0ms/iteration measured in the shared JVM
            # (run 31686209748) times the 1.4-1.6x slowdown the loaded arm
            # measured is ~61ms/iteration, so 1000 iterations is ~61s against
            # the 5-minute per-test deadline. The `load=suite` block above
            # already caps STRESS at 1000, and that cap governs here.
            if [ "$BURST" != "0" ]; then
              echo "::error::cotenancy=suite-jvm with burst_iterations=$BURST: refused. In this mode WsAnnouncementCatchUpBurstTest already runs as a CO-TENANT inside the suite invocation, at its committed default — the shape build-test-fast has. A separate filtered burst arm answers a different question and only spends minutes. Pass burst_iterations=0."
              exit 1
            fi
            if [ "$STRESS" -gt 4000 ]; then
              echo "::error::cotenancy=suite-jvm with stress_iterations=$STRESS: refused. MEASURED on run 31686209748: 500 iterations cost the probe 18.978s in the shared JVM, i.e. 38.0ms/iteration — indistinguishable from the 38.5ms it costs alone, so the siblings cost the probe's own 5-minute budget nothing detectable. The ceiling is therefore the same as the filtered one, kept at this job's default rather than the ~7000 the arithmetic allows, so that a slower runner cannot turn a large dispatch into NO sample (computenet-dqy.12). Ceiling 4000; dispatch again for a bigger sample."
              exit 1
            fi
          fi
          # THE LANE ARM HONOURS NO SIZE KNOB (computenet-dqy.55). It runs
          # build-test-fast's command verbatim, and that command forwards no
          # -D: the probe runs at the committed DEFAULT_ITERATIONS=25, which is
          # the whole point — it is the size the 2/450 harvest was collected at.
          # So rather than silently ignore the knobs (the exact trap this job's
          # header was written about: "a small sample wearing a large sample's
          # label"), refuse any dispatch whose knobs would be ignored. The
          # dispatcher has to type 25, and the ledger's denominator is then a
          # number somebody stated rather than one the workflow assumed.
          if [ "$LANE" = "build-check" ]; then
            [ "$PASSES" -gt 0 ] || { echo "::error::lane=build-check with lane_passes=$PASSES: refused. A lane arm with no passes measures nothing."; exit 1; }
            if [ "$STRESS" != "25" ]; then
              echo "::error::lane=build-check with stress_iterations=$STRESS: refused. This arm runs 'build check' exactly as ci.yml does, and that command forwards no -Dwire.stress.iterations, so the probe runs at its committed default of 25 whatever is passed here. Pass stress_iterations=25 to state the size this arm actually samples."
              exit 1
            fi
            if [ "$BURST" != "0" ]; then
              echo "::error::lane=build-check with burst_iterations=$BURST: refused. WsAnnouncementCatchUpBurstTest runs inside 'check' at ITS committed default; a separately dispatched burst arm would not be part of the lane condition. Pass burst_iterations=0."
              exit 1
            fi
            if [ "$COTENANCY" != "filtered" ] || [ "$LOAD" != "none" ]; then
              echo "::error::lane=build-check with cotenancy=$COTENANCY load=$LOAD: refused. The lane arm's JVM shape and machine load are properties OF the lane — 'build check' under org.gradle.parallel=true already puts the whole ':wire:' suite in one test JVM and other modules' tasks on the same runner. Setting either knob would layer a second, different condition on top of the one being reproduced. Pass load=none cotenancy=filtered; the summary below records what the lane itself supplies."
              exit 1
            fi
            # A pass costs ~2-2.5 min (build-test-fast measured 158-171s
            # including ~40s of setup this job pays once), against this job's
            # 350-minute timeout. The bound is generous; it exists so a typo'd
            # three-digit pass count fails in two seconds rather than burning
            # an afternoon of runner time.
            if [ "$PASSES" -gt 60 ]; then
              echo "::error::lane=build-check with lane_passes=$PASSES: refused. At ~2.5 min/pass that is over 2.5 hours; ceiling 60. Dispatch again for a bigger sample — two dispatches of 30 are two independent samples and this workflow does not cancel them against each other. They do not run at the same time, though: the concurrency group is per-ref, so a second dispatch on this ref QUEUES behind the first (observed 2026-08-13: ~19 minutes pending). Budget the wall time as their sum."
              exit 1
            fi
          fi
          awaits=$((STRESS * 2))
          refs=$((BURST * REFS))
          lane_awaits=$((PASSES * 50))
          {
            echo "## Announcement probe — requested sample"
            echo ""
            echo "| knob | value | derived |"
            echo "| --- | --- | --- |"
            echo "| lane (invocation condition) | $LANE | $([ "$LANE" = build-check ] && echo "build-test-fast's whole command, $PASSES pass(es) = $lane_awaits awaits at the committed size" || echo 'a dedicated :wire:test dispatched by this job') |"
            echo "| load (concurrency condition) | $LOAD | $([ "$LOAD" = suite ] && echo 'build check runs alongside the probe' || echo 'probe runs essentially alone') |"
            echo "| cotenancy (in-JVM condition) | $COTENANCY | $([ "$COTENANCY" = suite-jvm ] && echo 'whole :wire: suite shares one test JVM with the probe' || echo 'probe is the only class in the test JVM') |"
            echo "| wire.stress.iterations | $STRESS | $awaits announcement awaits |"
            echo "| wire.burst.iterations | $BURST | $([ "$BURST" -eq 0 ] && echo 'burst arm SKIPPED' || echo "$refs announced refs") |"
            echo "| wire.burst.refs | $REFS | |"
            echo ""
          } | tee -a "$GITHUB_STEP_SUMMARY"
          echo "STRESS_AWAITS=$awaits" >> "$GITHUB_ENV"
          echo "BURST_REFS_TOTAL=$refs" >> "$GITHUB_ENV"
          echo "LANE_AWAITS=$lane_awaits" >> "$GITHUB_ENV"

      # PREFLIGHT. Poison each forwarded key in turn and require the probe to
      # fail in the specific way that proves the value arrived. A run where the
      # forwarding is broken cannot reach the measurement steps.
      #
      # Verified locally on this branch before landing (macOS, same Gradle
      # build): `./gradlew :wire:test --tests '*WsAnnouncementCatchUpBurstTest*'
      # --rerun -Dwire.burst.iterations=NOT_A_NUMBER` exits 1 with
      # `java.lang.NumberFormatException: For input string: "NOT_A_NUMBER"` at
      # WsAnnouncementCatchUpBurstTest.kt:151.
      #
      # `wire.stress.injectFailureAt` cannot use that same poison (see the job
      # header): its parser tolerates a non-numeric value by design, so
      # `NOT_A_NUMBER` would produce a clean, silent, ZERO-failure run whether
      # forwarding works or is broken — indistinguishable either way. Verified
      # locally instead with a REAL injection value: `./gradlew :wire:test
      # --tests '*WsAnnouncementStressTest*' --rerun
      # -Dwire.stress.injectFailureAt=0` exits 1, and the console carries
      # `plus 2 injected synthetic failure(s), which measure nothing` — the
      # `INJECTED SYNTHETIC FAILURE` banner itself is written only to the
      # per-failure artifact file, not to the console/exception text, so that
      # banner is not what this preflight can grep for.
      #
      # SKIPPED for `lane=build-check`, and that is not a shortcut: that arm
      # forwards no -D at all — its whole claim is that it runs at the
      # committed default — so there is no forwarding to re-prove, and the size
      # step above refuses any dispatch that asked for a different size.
      - name: Preflight - prove each -D reaches the test JVM
        if: ${{ inputs.lane == 'task' }}
        run: |
          set -uo pipefail
          poison() {
            key="$1"; filter="$2"
            echo "== poisoning -D$key =="
            set +e
            ./gradlew :wire:test --tests "$filter" --rerun "-D$key=NOT_A_NUMBER" > "preflight-$key.log" 2>&1
            status=$?
            set -e
            cat "preflight-$key.log"
            if [ "$status" -eq 0 ]; then
              echo "::error::-D$key was IGNORED — a poisoned value produced a green run, so any size passed to this job is a lie. Check the forwarding block in wire/build.gradle.kts."
              return 1
            fi
            if ! grep -q 'NumberFormatException: For input string: "NOT_A_NUMBER"' "preflight-$key.log"; then
              echo "::error::-D$key run failed, but not with the expected NumberFormatException — cannot conclude the value arrived."
              return 1
            fi
            echo "-D$key reaches the test JVM."
          }
          # computenet-dqy.63: wire.stress.injectFailureAt's parser is
          # deliberately tolerant of garbage (a malformed entry in a long
          # measurement run's -D is dropped, not fatal), so poisoning it with
          # NOT_A_NUMBER proves nothing — forward it a real value instead and
          # require the induced failure.
          poison_inject() {
            key="wire.stress.injectFailureAt"
            echo "== forwarding -D$key=0, expecting an induced failure =="
            set +e
            ./gradlew :wire:test --tests '*WsAnnouncementStressTest*' --rerun "-D$key=0" > "preflight-$key.log" 2>&1
            status=$?
            set -e
            cat "preflight-$key.log"
            if [ "$status" -eq 0 ]; then
              echo "::error::-D$key was IGNORED — forcing an injection at iteration 0 produced a green run, so the property never reached (or was never read by) the test JVM. Check the @Test in WsAnnouncementStressTest.kt and the forwarding block in wire/build.gradle.kts."
              return 1
            fi
            if ! grep -q 'injected synthetic failure' "preflight-$key.log"; then
              echo "::error::-D$key run failed, but not with the expected injected-failure summary — cannot conclude the value arrived and was honoured rather than the run failing for some unrelated reason."
              return 1
            fi
            echo "-D$key reaches the test JVM and forces the expected failure."
          }
          rc=0
          poison wire.stress.iterations '*WsAnnouncementStressTest*' || rc=1
          poison wire.burst.iterations '*WsAnnouncementCatchUpBurstTest*' || rc=1
          poison wire.burst.refs '*WsAnnouncementCatchUpBurstTest*' || rc=1
          poison_inject || rc=1
          exit $rc

      # ---------------- the loaded arm (computenet-dqy.52) ----------------
      # Everything between here and "Stop the concurrent suite load" is skipped
      # entirely when load=none, so the isolated arm is byte-for-byte the job
      # that produced runs 31669727862 / 31669883848 / 31670959177 and remains
      # comparable with them.
      - name: Start the concurrent suite load
        if: ${{ inputs.load == 'suite' && inputs.lane == 'task' }}
        run: |
          set -euo pipefail
          echo "runner: $(nproc) cores"; free -m
          # A separate project directory (see the header: two Gradle builds in
          # one project directory block each other on that directory's locks,
          # which would serialise the load against the probe instead of running
          # it alongside). $GRADLE_USER_HOME stays shared, as it would be for
          # any two projects built at once on one machine.
          cp -a "$GITHUB_WORKSPACE" "$RUNNER_TEMP/load-copy"

          cat > "$RUNNER_TEMP/load.sh" <<'EOF'
          #!/usr/bin/env bash
          cd "$RUNNER_TEMP/load-copy"
          n=0
          while [ ! -f "$RUNNER_TEMP/probe-done" ]; do
            n=$((n + 1))
            echo "===== load pass $n starting $(date -Is) ====="
            # build-test-fast's own command. `--rerun-tasks` so a second pass
            # is real work rather than an up-to-date no-op; failures are
            # irrelevant here — this build is load, not a gate.
            ./gradlew build check -PexcludeMultiJvm=true -x :kernel:test --rerun-tasks || true
            echo "===== load pass $n finished $(date -Is) ====="
          done
          echo "===== load loop exited after $n pass(es) $(date -Is) ====="
          EOF
          chmod +x "$RUNNER_TEMP/load.sh"

          # Evidence that the condition was real, sampled throughout: without
          # this, "loaded" is an assertion about a background process nobody
          # looked at.
          cat > "$RUNNER_TEMP/sampler.sh" <<'EOF'
          #!/usr/bin/env bash
          while [ ! -f "$RUNNER_TEMP/probe-done" ]; do
            echo "$(date -Is) loadavg=$(cut -d' ' -f1-3 /proc/loadavg) mem_available_mb=$(awk '/MemAvailable/{print int($2/1024)}' /proc/meminfo) java_procs=$(pgrep -c java || echo 0)"
            sleep 10
          done
          EOF
          chmod +x "$RUNNER_TEMP/sampler.sh"

          rm -f "$RUNNER_TEMP/probe-done"
          # setsid so the whole load process group can be killed later; killing
          # the loop alone would leave its Gradle child loading the runner
          # through the upload steps.
          setsid nohup "$RUNNER_TEMP/load.sh" > load.log 2>&1 &
          echo $! > "$RUNNER_TEMP/load.pid"
          setsid nohup "$RUNNER_TEMP/sampler.sh" > loadavg.log 2>&1 &
          echo $! > "$RUNNER_TEMP/sampler.pid"

          # Let the load reach steady state before the probe starts; the first
          # pass spends its opening seconds in Gradle configuration, which is
          # not the contention the probe is supposed to meet.
          sleep 60
          echo "== loadavg after 60s of warm-up =="
          tail -5 loadavg.log

      # ---------------- the lane arm (computenet-dqy.55) ----------------
      # THE CONDITION NO OTHER ARM REPRODUCES. Every arm above dispatches a
      # ':wire:test' of its own. build-test-fast does not: it runs `build check`
      # over EVERY module under org.gradle.parallel=true, so ':wire:test' shares
      # a runner with other modules' compile and test tasks, gets Gradle's own
      # worker scheduling rather than a single task's, and runs the probe at the
      # COMMITTED wire.stress.iterations=25. That is the invocation the 2 losses
      # in 450 awaits were harvested from, and ~30,000 zero-loss awaits across
      # three dispatched conditions have not touched it.
      #
      # The command is build-test-fast's, character for character, minus
      # `--profile` (a reporting flag). `--rerun-tasks` from pass 2 on, for the
      # same reason the load loop uses it: without it a second pass is an
      # up-to-date no-op that adds a pass to the denominator and no awaits to
      # the sample. Pass 1 runs without it so the first pass is exactly the
      # fast lane's own cold-clone invocation.
      #
      # Each pass's ':wire:' XML is harvested BEFORE the next pass overwrites
      # it, and each pass is classified by the same report script every other
      # arm uses — so an incomplete or unrecognised pass contributes neither
      # numerator nor denominator here either (computenet-dqy.12 / .54), rather
      # than being averaged into a rate.
      #
      # It also prints the roster per pass. That settles, from the lane's own
      # invocation, the ordering question computenet-dqy.53 left open: the
      # dispatched co-tenant arm put WsAnnouncementStressTest at class 3 of 13,
      # and until ci.yml started publishing its XML on success (this bead's
      # other half) nothing said whether the fast lane agrees.
      - name: Lane arm - build-test-fast's own command, repeated
        if: ${{ inputs.lane == 'build-check' }}
        env:
          PASSES: ${{ inputs.lane_passes }}
        run: |
          set -uo pipefail
          total_losses=0
          total_awaits=0
          usable=0
          unusable=0
          outcomes=""
          for pass in $(seq 1 "$PASSES"); do
            echo "===== lane pass $pass/$PASSES starting $(date -Is) ====="
            rerun=""
            [ "$pass" -gt 1 ] && rerun="--rerun-tasks"
            set +e
            # shellcheck disable=SC2086
            ./gradlew build check -PexcludeMultiJvm=true -x :kernel:test $rerun
            status=$?
            set -e
            echo "===== lane pass $pass exit=$status $(date -Is) ====="
            dest="probe-evidence/lane/pass-$pass"
            mkdir -p "$dest"
            cp -a wire/build/test-results/test/. "$dest/" 2>/dev/null || true

            echo "--- pass $pass roster ---"
            python3 .github/scripts/announcement_probe_cotenancy.py "$dest" WsAnnouncementStressTest || true

            # Point the report script's GITHUB_ENV at a per-pass file: its
            # numerator/denominator publishing is per-arm by design, and this
            # arm is many arms. The real $GITHUB_ENV gets the aggregate below.
            envfile="$dest/counts.env"
            : > "$envfile"
            set +e
            GITHUB_ENV="$envfile" \
            PROBE_OUTCOME_KEY=PASS_OUTCOME PROBE_LOSSES_KEY=PASS_LOSSES \
            PROBE_UNITS_KEY=PASS_UNITS PROBE_EXPECTED_UNITS=50 \
              python3 .github/scripts/announcement_probe_report.py "$dest" \
                "lane pass $pass/$PASSES (build check, committed size)" WsAnnouncementStressTest
            set -e
            outcome=$(sed -n 's/^PASS_OUTCOME=//p' "$envfile" | tail -1)
            losses=$(sed -n 's/^PASS_LOSSES=//p' "$envfile" | tail -1)
            units=$(sed -n 's/^PASS_UNITS=//p' "$envfile" | tail -1)
            outcome=${outcome:-missing}
            outcomes="$outcomes $pass:$outcome"
            case "$outcome" in
              clean|loss)
                total_losses=$((total_losses + ${losses:-0}))
                total_awaits=$((total_awaits + ${units:-0}))
                usable=$((usable + 1))
                ;;
              *)
                # incomplete / unrecognised / vacuous / missing: NO sample.
                unusable=$((unusable + 1))
                ;;
            esac
            echo "pass $pass: outcome=$outcome losses=${losses:-?} awaits=${units:-?} (running total $total_losses/$total_awaits over $usable usable pass(es))"
          done
          echo "LANE_LOSSES=$total_losses" >> "$GITHUB_ENV"
          echo "LANE_UNITS=$total_awaits" >> "$GITHUB_ENV"
          echo "LANE_USABLE=$usable" >> "$GITHUB_ENV"
          echo "LANE_UNUSABLE=$unusable" >> "$GITHUB_ENV"
          if [ "$usable" -eq 0 ]; then
            echo "LANE_OUTCOME=vacuous" >> "$GITHUB_ENV"
          elif [ "$total_losses" -gt 0 ]; then
            echo "LANE_OUTCOME=loss" >> "$GITHUB_ENV"
          elif [ "$unusable" -gt 0 ]; then
            echo "LANE_OUTCOME=partial" >> "$GITHUB_ENV"
          else
            echo "LANE_OUTCOME=clean" >> "$GITHUB_ENV"
          fi
          {
            echo "### Lane arm — per-pass outcomes"
            echo ""
            echo "\`$outcomes\`"
            echo ""
            echo "Usable passes: $usable; unusable (no sample): $unusable. Aggregate $total_losses loss(es) in $total_awaits awaits."
            echo ""
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Stress probe (announcement path, catch-up + live shapes)
        if: ${{ inputs.lane == 'task' }}
        env:
          STRESS: ${{ inputs.stress_iterations }}
          COTENANCY: ${{ inputs.cotenancy }}
        run: |
          set -uo pipefail
          set +e
          if [ "$COTENANCY" = "suite-jvm" ]; then
            # THE CO-TENANT ARM (computenet-dqy.53). No `--tests` filter: the
            # whole `:wire:` suite in one test JVM, which is the shape
            # build-test-fast gives the probe. `-PexcludeMultiJvm=true` is
            # build-test-fast's own flag, kept so the two commands cannot drift.
            # Only the stress key is forwarded — the burst test runs here as a
            # co-tenant at its committed default, as it does in the fast lane.
            ./gradlew :wire:test --rerun -PexcludeMultiJvm=true \
              "-Dwire.stress.iterations=$STRESS"
          else
            ./gradlew :wire:test --tests '*WsAnnouncementStressTest*' --rerun \
              "-Dwire.stress.iterations=$STRESS"
          fi
          echo "STRESS_STATUS=$?" >> "$GITHUB_ENV"
          set -e
          mkdir -p probe-evidence/stress
          cp -a wire/build/test-results/test/. probe-evidence/stress/

      # Evidence that the co-tenancy was REAL and in which order it happened,
      # the counterpart of `loadavg.log` for `load=suite`. Without it, "the
      # suite shared the JVM" is an assertion about a Gradle command line.
      - name: Co-tenancy roster
        if: ${{ !cancelled() && inputs.lane == 'task' && inputs.cotenancy == 'suite-jvm' }}
        run: python3 .github/scripts/announcement_probe_cotenancy.py probe-evidence/stress WsAnnouncementStressTest

      - name: Stress probe - full report
        if: ${{ !cancelled() && inputs.lane == 'task' }}
        env:
          PROBE_OUTCOME_KEY: STRESS_OUTCOME
          PROBE_LOSSES_KEY: STRESS_LOSSES
          PROBE_UNITS_KEY: STRESS_UNITS
          PROBE_EXPECTED_UNITS: ${{ env.STRESS_AWAITS }}
        run: python3 .github/scripts/announcement_probe_report.py probe-evidence/stress "stress, load=${{ inputs.load }}, cotenancy=${{ inputs.cotenancy }} (${{ inputs.stress_iterations }} iterations)" WsAnnouncementStressTest

      - name: Catch-up burst probe
        if: ${{ !cancelled() && inputs.lane == 'task' && inputs.burst_iterations != '0' }}
        env:
          BURST: ${{ inputs.burst_iterations }}
          REFS: ${{ inputs.burst_refs }}
        run: |
          set -uo pipefail
          set +e
          ./gradlew :wire:test --tests '*WsAnnouncementCatchUpBurstTest*' --rerun \
            "-Dwire.burst.iterations=$BURST" "-Dwire.burst.refs=$REFS"
          echo "BURST_STATUS=$?" >> "$GITHUB_ENV"
          set -e
          mkdir -p probe-evidence/burst
          cp -a wire/build/test-results/test/. probe-evidence/burst/

      - name: Catch-up burst probe - full report
        if: ${{ !cancelled() && inputs.lane == 'task' && inputs.burst_iterations != '0' }}
        env:
          PROBE_OUTCOME_KEY: BURST_OUTCOME
          PROBE_LOSSES_KEY: BURST_LOSSES
          PROBE_UNITS_KEY: BURST_UNITS
          PROBE_EXPECTED_UNITS: ${{ inputs.burst_iterations }}
        run: python3 .github/scripts/announcement_probe_report.py probe-evidence/burst "burst, load=${{ inputs.load }}, cotenancy=${{ inputs.cotenancy }} (${{ inputs.burst_iterations }} iterations x ${{ inputs.burst_refs }} refs)" WsAnnouncementCatchUpBurstTest

      # The load must outlive both arms and nothing else. Killing the process
      # group (not just the loop) matters: the loop's Gradle child would
      # otherwise keep the runner busy through the upload steps and, worse,
      # could still be running if a future arm is added below.
      - name: Stop the concurrent suite load
        if: ${{ !cancelled() && inputs.lane == 'task' && inputs.load == 'suite' }}
        run: |
          set -uo pipefail
          touch "$RUNNER_TEMP/probe-done"
          for pidfile in load.pid sampler.pid; do
            pid=$(cat "$RUNNER_TEMP/$pidfile" 2>/dev/null || echo "")
            [ -n "$pid" ] && kill -TERM -"$pid" 2>/dev/null
          done
          sleep 5
          mkdir -p probe-evidence/load
          cp -a load.log loadavg.log probe-evidence/load/ 2>/dev/null || true
          echo "== load passes =="
          grep -E '^===== load pass' load.log || echo "(no load pass completed a boundary marker)"
          echo "== machine load sampled while the probe ran =="
          cat loadavg.log || true
          {
            echo "### Concurrency condition: load=suite"
            echo ""
            echo "Load command (separate repo copy, own Gradle daemon, shared GRADLE_USER_HOME):"
            echo '`./gradlew build check -PexcludeMultiJvm=true -x :kernel:test --rerun-tasks`, looped until the probes finished.'
            echo ""
            echo "loadavg (1m) samples: $(awk '{for(i=1;i<=NF;i++) if($i ~ /^loadavg=/) {split(substr($i,9),a,","); print a[1]}}' loadavg.log | sort -n | awk '{v[NR]=$1} END {if (NR) printf "n=%d min=%s median=%s max=%s", NR, v[1], v[int((NR+1)/2)], v[NR]; else printf "none"}')"
            echo ""
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # Cheap and unconditional: two XML files. A green run's XML is the
      # executed-size record, a red run's is the occurrence.
      - name: Upload probe evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: announcement-probe-evidence
          path: probe-evidence
          if-no-files-found: warn
          retention-days: 90

      # The probe steps swallow their exit status so that a failure in the first
      # probe does not cost the second probe's sample. The job conclusion is set
      # here instead, so a lost announcement still reddens this run.
      #
      # THREE OUTCOMES, NOT TWO (computenet-dqy.50). This step used to say
      # "stress probe reported failures" for both a lost announcement and a
      # sample that never finished, which invites a timeout being recorded as an
      # occurrence — computenet-dqy.12 is explicit that a JUnit 5m
      # TimeoutException proves neither a failure nor an in-JVM block. The
      # classification comes from the report script (which reads the JUnit XML),
      # not from an exit status, because a Gradle exit status cannot tell the two
      # apart. Both still redden the run: an unfinished sample is a wasted
      # dispatch and must not pass quietly either.
      #
      # FOUR, ACTUALLY (computenet-dqy.54). The same reasoning has a mirror
      # image: the report script used to call ANY non-timeout failure a loss, so
      # an OutOfMemoryError — the failure shape the `load=suite` arm is by
      # construction most likely to produce — printed the ANNOUNCEMENT LOST
      # error below and invited an infrastructure death onto computenet-dqy.40
      # as an occurrence. A loss is now recognised POSITIVELY, by the probe's
      # own report line, and a non-timeout failure without one is
      # `unrecognised`. That arm reddens the run like the other unusable ones
      # and contributes no numerator and no denominator to the ledger.
      - name: Conclude
        if: ${{ !cancelled() }}
        env:
          LOAD: ${{ inputs.load }}
          COTENANCY: ${{ inputs.cotenancy }}
          BURST_REQUESTED: ${{ inputs.burst_iterations }}
          LANE: ${{ inputs.lane }}
          PASSES: ${{ inputs.lane_passes }}
        run: |
          set -uo pipefail

          # THE LANE ARM'S OWN LEDGER (computenet-dqy.55). Its row is not
          # comparable to a dispatched arm's by size — it is comparable by
          # CONDITION, which is the point: this is the only row collected in the
          # invocation the 2/450 harvest came from. `usable`/`unusable` are
          # reported because the denominator here is a sum over passes and a
          # reader must be able to see how many passes were thrown away rather
          # than averaged in (computenet-dqy.12 / .54).
          if [ "$LANE" = "build-check" ]; then
            cond="lane=build-check (build-test-fast's command, committed size), $PASSES pass(es) requested"
            {
              echo "### Ledger — condition \`$cond\`"
              echo ""
              echo "| arm | condition | losses (numerator) | sample (denominator) | outcome |"
              echo "| --- | --- | --- | --- | --- |"
              echo "| lane | $cond | ${LANE_LOSSES:-unknown} | ${LANE_UNITS:-unknown} awaits over ${LANE_USABLE:-unknown} usable pass(es) | ${LANE_OUTCOME:-missing} |"
              echo "| stress | — | — | — | SKIPPED (lane arm owns the invocation) |"
              echo "| burst | — | — | — | SKIPPED (runs inside \`check\` as a co-tenant at its committed size) |"
              echo ""
              echo "Unusable passes (contributing NO numerator and NO denominator): ${LANE_UNUSABLE:-unknown}."
              echo ""
              echo "This condition is not on the \`load\` or \`cotenancy\` axes — it is the invocation itself. Compare it against build-test-fast's own harvest (2 losses in 450 awaits), not against a dispatched arm's size."
              echo ""
            } | tee -a "$GITHUB_STEP_SUMMARY"
            case "${LANE_OUTCOME:-missing}" in
              clean)
                echo "lane arm: CLEAN — ${LANE_UNITS:-?} awaits in build-test-fast's own invocation, 0 losses." \
                  | tee -a "$GITHUB_STEP_SUMMARY"
                exit 0
                ;;
              partial)
                echo "::error::lane arm: ${LANE_LOSSES:-0} losses in ${LANE_UNITS:-?} awaits, but ${LANE_UNUSABLE:-?} pass(es) produced NO sample and were excluded. The countable rows above stand; read the per-pass outcomes for what was dropped and why."
                exit 1
                ;;
              loss)
                echo "::error::lane arm: ANNOUNCEMENT LOST — ${LANE_LOSSES:-?} in ${LANE_UNITS:-?} awaits, in the invocation build-test-fast actually uses. This is an occurrence; record it verbatim on computenet-dqy.40 with this run id."
                exit 1
                ;;
              *)
                echo "::error::lane arm: NO USABLE PASS (outcome='${LANE_OUTCOME:-missing}') — this run measured nothing."
                exit 1
                ;;
            esac
          fi

          echo "stress exit=${STRESS_STATUS:-missing} outcome=${STRESS_OUTCOME:-missing}"
          echo "burst  exit=${BURST_STATUS:-missing} outcome=${BURST_OUTCOME:-missing}"

          # THE LEDGER (computenet-dqy.52). One row per arm, numerator and
          # denominator kept apart and labelled with the condition they were
          # collected under, so two dispatches can be compared without anyone
          # having to reconstruct which run had which sizes. `unknown` is not a
          # zero: an incomplete or unrecognised arm contributes to no rate at
          # all — not to the numerator and not to the denominator.
          cond="load=$LOAD, cotenancy=$COTENANCY"
          {
            echo "### Ledger — condition \`$cond\`"
            echo ""
            echo "| arm | condition | losses (numerator) | sample (denominator) | outcome |"
            echo "| --- | --- | --- | --- | --- |"
            echo "| stress | $cond | ${STRESS_LOSSES:-unknown} | ${STRESS_UNITS:-unknown} awaits | ${STRESS_OUTCOME:-missing} |"
            if [ "$BURST_REQUESTED" = "0" ]; then
              echo "| burst | $cond | — | — | SKIPPED (burst_iterations=0) |"
            else
              echo "| burst | $cond | ${BURST_LOSSES:-unknown} | ${BURST_UNITS:-unknown} iterations | ${BURST_OUTCOME:-missing} |"
            fi
            echo ""
            echo "This is ONE condition, on ONE axis. Each comparison needs the matching dispatch at the SAME sizes with the other value of that axis: \`load\` for computenet-dqy.52 (answered: null), \`cotenancy\` for computenet-dqy.53."
            echo ""
          } | tee -a "$GITHUB_STEP_SUMMARY"

          rc=0
          verdict() {
            arm="$1"; outcome="$2"; status="$3"; hint="$4"
            case "$outcome" in
              clean)
                if [ "$status" = "0" ]; then
                  echo "$arm: CLEAN — a real sample completed and lost nothing."
                elif [ "$arm" = "stress probe" ] && [ "$COTENANCY" = "suite-jvm" ]; then
                  # In this mode the exit status covers all 13 `:wire:` classes
                  # (computenet-dqy.53). The probe's own testcase executed and
                  # reported no loss, so its numerator and denominator STAND;
                  # what failed was a co-tenant. Still red — a `:wire:` failure
                  # is not something this job should swallow — but the ledger row
                  # above is countable and must not be discarded.
                  echo "::error::$arm: the stress testcase is CLEAN and its sample COUNTS, but the suite invocation exited $status — a SIBLING :wire: class failed. That is not an announcement loss and not a reason to drop this arm's row from the ledger. Read the co-tenancy roster and the Gradle log above for which class it was."
                  rc=1
                else
                  echo "::error::$arm: the probe invocation failed for a reason outside the testcase (exit $status) — read the log above"
                  rc=1
                fi
                ;;
              loss)
                echo "::error::$arm: ANNOUNCEMENT LOST — this is an occurrence. The full two-sided report is above and the JUnit XML is attached as an artifact; record it verbatim on computenet-dqy.40."
                rc=1
                ;;
              incomplete)
                echo "::error::$arm: SAMPLE DID NOT COMPLETE — the requested size did not fit the build's 5-minute per-test JUnit timeout, so NO sample was produced. This is NOT an announcement loss (computenet-dqy.12) and must not be recorded as one. Re-dispatch smaller: $hint"
                rc=1
                ;;
              unrecognised)
                echo "::error::$arm: FAILED OUTSIDE THE ANNOUNCEMENT PATH — the failure record carries neither the per-test JUnit timeout nor a probe report line, so it is NOT an announcement loss (computenet-dqy.54) and must not be recorded on computenet-dqy.40. Both probes always render their own report line when they lose one; its absence is positive evidence this came from elsewhere (infrastructure, the JVM, or the build — an OutOfMemoryError under load=suite is the expected shape). NO sample was produced: this arm contributes no numerator and no denominator. Read the full failure text above and re-dispatch."
                rc=1
                ;;
              vacuous)
                echo "::error::$arm: NOTHING RAN — no executed testcase in the JUnit XML, so the sample size was zero rather than the requested one."
                rc=1
                ;;
              *)
                echo "::error::$arm: the report step did not classify this arm (outcome='${outcome:-missing}', exit ${status:-missing}) — treat the run as inconclusive."
                rc=1
                ;;
            esac
          }
          verdict "stress probe" "${STRESS_OUTCOME:-}" "${STRESS_STATUS:-1}" \
            "measured 39.9ms/iteration on ubuntu-latest unloaded; ceiling ~7000, default 4000. Under load=suite the per-iteration cost is higher by an unmeasured factor — halve it. Under cotenancy=suite-jvm it is NOT: measured 37.2-40.1ms/iteration over runs 31686209748/31686456879/31686485278, indistinguishable from unloaded, so the filtered sizing applies unchanged."
          if [ "$BURST_REQUESTED" = "0" ]; then
            echo "burst probe: SKIPPED by request (burst_iterations=0). It contributes no sample and no verdict."
          else
            verdict "burst probe" "${BURST_OUTCOME:-}" "${BURST_STATUS:-1}" \
              "6000 x 40 took 269s of the 300s budget; go below that."
          fi
          if [ "$rc" = "0" ]; then
            if [ "$BURST_REQUESTED" = "0" ]; then
              echo "Probe green under $cond: ${STRESS_AWAITS:-?} announcement awaits, 0 losses (burst arm skipped)." \
                | tee -a "$GITHUB_STEP_SUMMARY"
            else
              echo "Both probes green under $cond: ${STRESS_AWAITS:-?} announcement awaits and ${BURST_REFS_TOTAL:-?} announced refs, 0 losses." \
                | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          fi
          exit $rc
