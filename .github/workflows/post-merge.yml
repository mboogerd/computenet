name: Post-merge validation

# Validates `main` itself, which nothing else in this repo does.
#
# Why it has to exist (computenet-8z6). `auto-merge.yml` arms GitHub's
# auto-merge with `secrets.GITHUB_TOKEN`, so GitHub performs the squash as
# `app/github-actions`. Events attributed to that token deliberately do not
# start new workflow runs, so `ci.yml`'s `on: push: branches: [main]` never
# fires after an auto-merge and the squashed result is never tested. Measured,
# not assumed: `main` at 0477d8d (#16, merged by `app/github-actions`) has no
# CI run at all, while bacfe5f (#20, merged by the human `mboogerd`) does —
# 31360185624. The push lane works; only bot merges bypass it.
#
# That matters because auto-merge lands PRs that were each green against an
# *older* `main`. Two independently-green PRs can compose into a broken `main`,
# and with the push lane inert nobody is ever told.
#
# Why the secret-free route. The three candidate fixes were: merge with a PAT
# or GitHub App token instead of `GITHUB_TOKEN`; add scheduled/manual runs on
# `main`; or drive validation from another event. The first is the only one
# that genuinely restores `on: push`, but it needs a repository secret that no
# agent may create, and it hands write-to-main to a long-lived credential —
# a decision for a human. This workflow takes the routes that need no secret:
#
#   - `pull_request` `closed`, guarded on `merged == true`. Expect this lane
#     to be SUPPRESSED on a bot merge, and treat any run of it as a bonus
#     rather than as the guarantee. Reviewed against the documentation
#     (computenet-8z6 review): the suppression rule is stated for events in
#     general, not for `push`, and the exceptions are enumerated —
#     `workflow_dispatch` and `repository_dispatch` always create a run, and
#     `pull_request` with the `opened`, `synchronize` or `reopened` activity
#     types creates a run in an approval-required state. `closed` is not on
#     that list, and the enumerated `pull_request` exception does not reach it.
#     The repo evidence points the same way: across the last 100 runs here,
#     every single one is actored by the human `mboogerd`, and the eleven
#     `app/github-actions` merges to date produced no run of any workflow at
#     all. So this lane is kept because it costs nothing, is correct if it does
#     fire, and settles the question on the next bot merge — not because it can
#     be relied on. It is the schedule below that carries this workflow.
#   - `schedule`, daily. This is the load-bearing lane, for the reason above:
#     a `schedule` event has no actor to suppress. It bounds how long a broken
#     `main` can sit unreported at ~24h, and it supplies the repeated `main`
#     evidence computenet-dqy's acceptance criteria asks for, at one data point
#     per day. Daily rather than hourly is deliberate: the suite is minutes, so
#     the minutes are not the constraint (this repo is public, so standard
#     runners are free), but `:inspect` and `:demo:shopping` still have open
#     flakes (computenet-8ru.5) and nothing here notifies anybody, so a faster
#     cadence would mostly manufacture unread red runs. Raise the cadence once
#     those lanes are green and a failure actually reaches a human.
#   - `workflow_dispatch`, so a human can validate `main` on demand — after a
#     manual merge, a revert, or a suspected flake.
#
# Why this is a SEPARATE FILE with prefixed job names. `ci.yml`'s header
# records an outage caused by exactly this class of change: one push matched
# two triggers, branch protection then saw two check runs per required check
# name, required every one of them to pass, and a single flake blocked the
# merge while auto-merge parked the PR silently. The six required check names
# are `build-test-fast`, `build-test-serial`, `concord-full`, `ui-test`,
# `agora-ui-test` and `kernel-test`. Branch protection matches a required
# check by its exact
# check-run name, which for a non-matrix job is the job id. Every job here is
# prefixed `main-`, so none of them can ever be mistaken for a required check
# — including on the merged PR's own SHA, where the `closed`-event checks
# surface. Adding a trigger to `ci.yml` instead would have reintroduced the
# duplicate-check-run failure mode directly, so `ci.yml` is left untouched.
#
# The jobs below deliberately mirror five of `ci.yml`'s six lanes
# command-for-command. `kernel-test` is NOT mirrored here — the fast lane's
# mirror still runs the whole `build check` including `:kernel:test`, so the
# kernel suite is covered on `main`, just not as its own lane.
# Keep them in step when a lane changes there; a reusable `workflow_call` would
# have deduplicated them, but calling it from `ci.yml` renames its check runs
# and breaks branch protection.
#
# What this does NOT fix. `on: push: branches: [main]` in `ci.yml` is still
# inert after a bot merge; this workflow does not restore it, it routes around
# it. computenet-0pd's push lane stays effectively dead until somebody supplies
# a PAT or a GitHub App token to `auto-merge.yml`, and that remains the only
# real fix for the push trigger itself. One further gap is open by design:
# validation is post-hoc, so a broken `main` is reported rather than prevented.
#
# Notification (computenet-dqy.9). The gap called out above used to include
# "and nothing here notifies a human" — the run's conclusion had to be looked
# at, because failure notifications for a bot-actored `pull_request` event may
# reach nobody. `main-notify-on-failure` and `main-notify-on-success` below
# close that: they open/update a GitHub issue through `secrets.GITHUB_TOKEN`.
# Chosen over the other two options the ticket listed (a bd bead from CI; a
# webhook/Slack notification) because it needs no new secret and no external
# service — an unattended agent cannot provision either of those, and a step
# that silently no-ops for lack of one is worse than useless here. A GitHub
# issue is also where a human already looks, and `gh` ships preinstalled on
# GitHub-hosted runners.
#
# Idempotent by construction: the `post-merge-failure` label identifies at
# most one open tracking issue. A failing run comments on it if it exists and
# opens it (once) otherwise — never a new issue per red run. A subsequent
# green run comments and closes it, so the issue does not linger once `main`
# recovers.
#
# Why the issue is ASSIGNED and @-mentions the repository owner. "An issue
# exists" is not the same as "somebody was told": an issue opened by
# `github-actions[bot]` only reaches a watcher whose notification settings
# happen to include repository issues, which is precisely the kind of
# depends-on-someone-looking channel this ticket exists to replace. An
# assignment and a mention each raise a direct notification regardless of
# watch state, and the assignment persists in "Assigned to you" until the
# issue is closed. The assignment is best-effort — if the login cannot be
# assigned the issue is still opened, unassigned, rather than lost.
#
# Where `continue-on-error` is and is NOT used, which is the whole design of a
# notifier: its failure mode is silence, so a permanently broken notifier that
# never fails anything is worse than one that occasionally cries wolf.
#   - The failure job's notifying step is NOT `continue-on-error`. That run is
#     already red by construction (the job only runs when a lane failed or was
#     cancelled), so letting `gh` fail loudly costs nothing — the run's
#     conclusion does not change — and it is the only thing that would ever
#     reveal a notifier broken by a permissions, quota or API change. On the
#     `schedule` lane that surfaces as GitHub's own scheduled-workflow-failure
#     mail, which is a channel that does not depend on the Actions tab either.
#   - The label step above it IS `continue-on-error`, so a hiccup creating the
#     label cannot skip the notification that follows it.
#   - The success job's step IS `continue-on-error`: there the run is green, so
#     a `gh` hiccup would turn a healthy `main` red and corrupt the
#     consecutive-green evidence computenet-dqy is collecting. Failing to close
#     the issue is self-correcting anyway — the stale issue stays assigned to a
#     human, who is thereby told to look.
on:
  pull_request:
    types: [closed]
  schedule:
    # Daily, off the hour — on-the-hour crons queue behind everyone else's.
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a run that has started. `ci.yml` exempts `main` from
# cancellation for a reason worth restating: a cancelled run reports
# `cancelled`, which fails quietly and notifies nobody, and a post-merge run is
# the only place a semantic conflict between two independently-green PRs can
# surface. Superseding a still-*pending* run (which GitHub does within a group)
# is safe by contrast: it never executed anything, and because every job checks
# out `main` by name the newer run validates a strictly newer tip — a superset
# of what the pending one would have covered.
concurrency:
  group: post-merge-main
  cancel-in-progress: false

jobs:
  # One place for the run condition, rather than five copies that can drift.
  # Every lane below `needs` this, and a skipped `needs` skips its dependents.
  #
  # `github.event_name != 'pull_request'` admits `schedule` and
  # `workflow_dispatch` unconditionally. For a `pull_request` event the only
  # activity type delivered is `closed`, and the two clauses then require that
  # the close was a merge and that it landed on `main` — a stacked PR merged
  # into some other base has not changed `main` and does not need validating.
  main-validation-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    #
    # Every continuation line below sits at exactly the block's indentation. In
    # a `>-` folded scalar a MORE-indented line is "more indented" and YAML
    # keeps its line break literally, so aligning them is what makes this fold
    # to a single line. A stray newline here would still evaluate (the
    # expression lexer treats it as whitespace), but this is the one expression
    # in the repo that decides whether `main` gets validated at all, and it
    # should not depend on that.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main')
    steps:
      - name: Explain what is being validated
        run: |
          echo "Validating refs/heads/main (event: ${{ github.event_name }})."

  # Fast lane — mirrors `ci.yml`'s `build-test-fast`.
  main-build-test-fast:
    needs: main-validation-gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # `ref: main` in every lane, on every event. The point of this workflow
      # is the squashed *result*, so it must not check out the PR head, nor
      # the `refs/pull/N/merge` ref that a `pull_request` event checks out by
      # default. On a manual dispatch this also means the run validates `main`
      # whatever ref was selected in the UI — the selection only chooses which
      # version of this file executes.
      - uses: actions/checkout@v4
        with:
          ref: main

      # `ref: main` resolves at checkout time, so it is a moving target: if
      # another PR merges between this run being queued and this step, the lane
      # validates a newer tip than the one that triggered it. That is the
      # intended trade (a newer tip is a superset), but it means the run does
      # not otherwise say WHICH commit it validated — and computenet-dqy's
      # "10 consecutive green runs on main" has to be read off these runs.
      # Every lane records its own, because each checks out independently and
      # they can legitimately differ within one run.
      - name: Record the validated commit
        run: git log -1 --format='validated main = %H %s'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and check (fast lane — excludes multi-jvm-tagged tests)
        run: ./gradlew build check -PexcludeMultiJvm=true

      # Clean-clone guard, as in `ci.yml`: a load-bearing file that was never
      # committed shows up here as an untracked file and fails the build.
      - name: Fail on unexpected untracked files
        run: test -z "$(git status --porcelain -uall -- doc '*/src')"

      # The JUnit XML is the only place a hang explains itself — see the long
      # rationale in `ci.yml`. Uploaded only when the job did not succeed.
      - name: Upload test results (diagnostics for failed or hung runs)
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: main-test-results-fast
          path: "**/build/test-results/**/*.xml"
          if-no-files-found: ignore
          retention-days: 14

  # Serial lane — mirrors `ci.yml`'s `build-test-serial`.
  main-build-test-serial:
    needs: main-validation-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      # See the fast lane above for why each lane records this.
      - name: Record the validated commit
        run: git log -1 --format='validated main = %H %s'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Multi-JVM serial lane (process-startup + wall-clock timing tests)
        run: ./gradlew check -PmultiJvmOnly=true --max-workers=1

      - name: Upload test results (diagnostics for failed or hung runs)
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: main-test-results-serial
          path: "**/build/test-results/**/*.xml"
          if-no-files-found: ignore
          retention-days: 14

  # Concord corpus — mirrors `ci.yml`'s `concord-full`.
  main-concord-full:
    needs: main-validation-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      # See the fast lane above for why each lane records this.
      - name: Record the validated commit
        run: git log -1 --format='validated main = %H %s'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run full concord corpus (core, dist, dur)
        run: ./gradlew :concord:test -Pconcord.profiles=core,dist,dur

      - name: Regenerate concordance matrix
        run: ./gradlew :concord:concordance

      # Regeneration must be a no-op: if this diffs, doc/spec/CONCORDANCE.md
      # drifted from the corpus and was hand-edited or left stale.
      - name: Confirm concordance regeneration is a no-op
        run: git diff --exit-code doc/spec/CONCORDANCE.md

      - name: Upload test results (diagnostics for failed or hung runs)
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: main-test-results-concord
          path: "**/build/test-results/**/*.xml"
          if-no-files-found: ignore
          retention-days: 14

  # Inspector frontend — mirrors `ci.yml`'s `ui-test`.
  main-ui-test:
    needs: main-validation-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      # See the fast lane above for why each lane records this.
      - name: Record the validated commit
        run: git log -1 --format='validated main = %H %s'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: inspect/ui/.nvmrc
          cache: npm
          cache-dependency-path: inspect/ui/package-lock.json

      - name: Install dependencies
        working-directory: inspect/ui
        run: npm ci

      - name: Typecheck
        working-directory: inspect/ui
        run: npm run typecheck

      - name: Test
        working-directory: inspect/ui
        run: npm test

  # Agora frontend — mirrors `ci.yml`'s `agora-ui-test`.
  main-agora-ui-test:
    needs: main-validation-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      # See the fast lane above for why each lane records this.
      - name: Record the validated commit
        run: git log -1 --format='validated main = %H %s'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: demo/agora/ui/.nvmrc
          cache: npm
          cache-dependency-path: demo/agora/ui/package-lock.json

      - name: Install dependencies
        working-directory: demo/agora/ui
        run: npm ci

      - name: Typecheck
        working-directory: demo/agora/ui
        run: npm run typecheck

      - name: Test
        working-directory: demo/agora/ui
        run: npm test

  # Notify a human on failure (computenet-dqy.9) — see the header comment for
  # why this is a GitHub issue rather than a bd bead or a webhook.
  #
  # `needs` lists every mirrored lane plus the gate, purely so `needs.*.result`
  # (used below) sees all of them. The job-level `if` replaces the implicit
  # "all needs succeeded" condition GitHub would otherwise apply, so this
  # still runs when a needed job failed, was cancelled (a hung lane hitting
  # its `timeout-minutes`, same signal the "Upload test results" steps above
  # treat as failure-shaped), or the run is unrelated to `main` and everything
  # upstream was cleanly skipped — that last case makes every entry
  # `needs.*.result` returns 'skipped', `contains(..., 'failure')` and
  # `contains(..., 'cancelled')` are both false, and this job is skipped too,
  # so a non-merge `pull_request closed` event opens nothing.
  main-notify-on-failure:
    needs:
      - main-validation-gate
      - main-build-test-fast
      - main-build-test-serial
      - main-concord-full
      - main-ui-test
      - main-agora-ui-test
    if: >-
      always() &&
      (contains(needs.*.result, 'failure') ||
      contains(needs.*.result, 'cancelled'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Job-level `permissions` replaces the workflow-level block for this job
    # rather than adding to it, so this grants exactly what `gh issue`/`gh
    # label` need and nothing else — in particular no `contents` access,
    # since this job never checks anything out.
    permissions:
      issues: write
    steps:
      # `--force` makes this idempotent: creates the label the first time,
      # updates (no-ops on identical) color/description every time after.
      # Needed because `gh issue create --label` fails outright if the label
      # does not already exist, and nothing else in this repo creates it.
      - name: Ensure the tracking label exists
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: >-
          gh label create post-merge-failure --repo "$REPO"
          --color b60205
          --description "post-merge validation on main is failing"
          --force

      # One open issue per incident, not one per red run: look for an open
      # issue carrying the tracking label and comment on it if found, else
      # create it. `.[0].number // empty` is deliberate — `gh issue list`
      # returns `[]` when nothing matches, `.[0]` on `[]` is `null` in jq, and
      # `null.number` is `null` (jq's null-propagation), so `// empty` turns
      # "nothing found" into an empty string rather than a jq error.
      #
      # The per-lane results go in the body on purpose. The acceptance
      # criterion is that a failure reaches a human WITHOUT them browsing the
      # Actions tab, and a notification that only carries a run URL sends them
      # straight back to it; "main-concord-full: failure, everything else
      # success" is triage that survives in the mail body.
      #
      # Deliberately not `continue-on-error` — see the header. The run is
      # already failing, so a loud `gh` failure here changes nothing except
      # that a broken notifier becomes discoverable.
      - name: Open or update the tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          EVENT: ${{ github.event_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          R_GATE: ${{ needs.main-validation-gate.result }}
          R_FAST: ${{ needs.main-build-test-fast.result }}
          R_SERIAL: ${{ needs.main-build-test-serial.result }}
          R_CONCORD: ${{ needs.main-concord-full.result }}
          R_UI: ${{ needs.main-ui-test.result }}
          R_AGORA: ${{ needs.main-agora-ui-test.result }}
        run: |
          set -e
          number=$(gh issue list --repo "$REPO" \
            --label post-merge-failure --state open \
            --json number --jq '.[0].number // empty')
          # printf rather than a heredoc or a multi-line shell string: both of
          # those would carry this block's YAML indentation into the body, and
          # four leading spaces make Markdown render the whole thing as a code
          # block.
          body=$(printf '%s\n' \
            "@${OWNER} — post-merge validation failed on \`main\` (event: ${EVENT})." \
            "" \
            "| lane | result |" \
            "| --- | --- |" \
            "| main-validation-gate | ${R_GATE} |" \
            "| main-build-test-fast | ${R_FAST} |" \
            "| main-build-test-serial | ${R_SERIAL} |" \
            "| main-concord-full | ${R_CONCORD} |" \
            "| main-ui-test | ${R_UI} |" \
            "| main-agora-ui-test | ${R_AGORA} |" \
            "" \
            "Run: ${RUN_URL}")
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$REPO" --body "$body"
          else
            create_args=(
              --repo "$REPO"
              --title "main is red: post-merge validation failing"
              --label post-merge-failure
              --body "$body"
            )
            # Assignment is what makes this land in somebody's inbox rather
            # than in a list they have to visit. If the owner login cannot be
            # assigned, fall back to opening the issue unassigned — an
            # unassigned alarm still beats no alarm. `gh` resolves assignee
            # logins before it POSTs, so the fallback cannot double-create.
            gh issue create "${create_args[@]}" --assignee "$OWNER" \
              || gh issue create "${create_args[@]}"
          fi

  # Mirror of the job above: once every mirrored lane is green again, stop
  # nagging. Same `needs`/`if` shape, inverted — this only runs when the gate
  # itself succeeded (so a skipped, irrelevant run stays silent) and nothing
  # among the mirrored lanes failed or was cancelled.
  main-notify-on-success:
    needs:
      - main-validation-gate
      - main-build-test-fast
      - main-build-test-serial
      - main-concord-full
      - main-ui-test
      - main-agora-ui-test
    if: >-
      always() &&
      needs.main-validation-gate.result == 'success' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Close the tracking issue if main is green again
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -e
          number=$(gh issue list --repo "$REPO" \
            --label post-merge-failure --state open \
            --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue close "$number" --repo "$REPO" \
              --reason completed \
              --comment "main is green again (event: ${EVENT}, run: ${RUN_URL})."
          else
            echo "No open post-merge-failure issue to close."
          fi
