name: CI

# A PR branch push used to match BOTH triggers, so every commit on an open PR
# started two full CI runs of the same SHA. That cost more than duplicated
# minutes: branch protection saw two check runs per required name and required
# every one of them to pass, so a single flaky failure in either run blocked the
# merge, and with auto-merge armed the PR then parked silently. Running the
# suites twice per commit also doubled the exposure to the genuinely flaky tests
# in `:wire`, `:inspect` and `:demo:shopping` (computenet-0pd).
#
# It does NOT fix those tests. They fail in isolated re-runs with nothing else in
# flight, and they fail on single-run branches, so the flakiness is intrinsic
# rather than contention between the duplicate runs — each Actions job gets its
# own ephemeral VM, so two runs never share a CPU or a bound port. Halving the
# executions halves how often the flakes are hit; that is all (computenet-8ru).
#
# Since then computenet-8ru has fixed the `:wire` cause (a dialer that started a
# retry thread per failed connect, in `WsTransport`) and one of the two `:inspect`
# tests. Still open: the `InspectorErrorsTest` 5-minute hang, undiagnosed — which
# is what the per-lane test-results upload below exists to make diagnosable — and
# the `:demo:shopping` `TwoJvmInspectorTest` lane (computenet-8ru.5).
#
# `push` is now restricted to `main`; PR validation runs from `pull_request`.
# Required checks are unaffected — the same five jobs still run on every PR,
# just once. Two corollaries worth knowing:
#
#   - A branch with no open PR now gets no CI, so a task branch is covered from
#     the point its feature PR exists rather than from its first push.
#   - The retained `main` lane is currently inert. Auto-merge squashes as
#     `GITHUB_TOKEN`, and pushes authored by that token deliberately do not
#     start new workflow runs, so no merge has triggered a `main` run since #2
#     (the last one a human merged). The `push` trigger is kept because it is
#     what *should* fire; making it actually fire is computenet-8z6.
#
#     Update (computenet-8z6): still inert, and still only firing for human
#     merges and direct pushes. Restoring it needs a PAT or GitHub App token in
#     `auto-merge.yml`, which is a human decision. In the meantime
#     `post-merge.yml` validates `main` on a daily schedule, plus a
#     `pull_request` `closed` lane that is expected to be suppressed on a bot
#     merge for the same reason this one is (see that file's header) — a
#     separate workflow with `main-`-prefixed jobs, and `closed`-only as its
#     `pull_request` activity type, precisely so it cannot collide with the
#     required check names above or add a check to an open PR.
on:
  push:
    branches: [main]
  pull_request:

# Supersede an in-flight run when a newer commit lands on the same ref. The
# superseded run's checks stay attached to a SHA that is no longer the PR head,
# so nothing branch protection reads is lost.
#
# `main` is deliberately exempt from cancellation. A post-merge run is the only
# place a semantic conflict between two independently-green PRs can surface,
# which is exactly what rapid auto-merges produce, and a cancelled run reports
# `cancelled` — it fails quietly and notifies nobody. That lane is inert today
# (see computenet-8z6), so this is defence in depth rather than a live guard: it
# also covers the case of a human merging or pushing to `main` directly, which
# does start a run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Fast lane: everything except the two-JVM/ProcessBuilder tests
  # (`@Tag("multi-jvm")`), default worker count, org.gradle.parallel=true.
  # This is the reliable, high-signal lane — 12+ of 14 exchange tests plus
  # every other module's suite run here — so the clean-clone untracked-files
  # guard (T01) lives at the end of THIS job, not stranded behind the flakier
  # serial lane below (T13 / doc/remediation/AUDIT-2026-07-28.md §W1).
  build-test-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # `cache-encryption-key` lets setup-gradle save/restore the project's
      # .gradle/configuration-cache directory, which it refuses to cache
      # unencrypted because a configuration-cache entry can capture secrets.
      # Without it every run recomputed ~12.7s of configuration per Gradle lane
      # despite org.gradle.configuration-cache=true (computenet-aer). If the
      # GRADLE_ENCRYPTION_KEY secret is unset the input is an empty string,
      # which setup-gradle coerces to undefined (`getCacheEncryptionKey() ||
      # undefined`) — it degrades to the old no-config-cache-save behavior
      # rather than failing.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      # :demo:beadsmirror's real-workspace suites drive `bd` and `dolt`. Most
      # `assumeTrue`-guard themselves and SKIP when the binaries are absent
      # (a lane green having asserted nothing about the mirror); two of them
      # fail outright. The install lives in one composite action so the four
      # workflow files that mirror this lane cannot copy everything except
      # this step — which is how `main` went red for twelve days
      # (computenet-mgxe, issue #304). Version pins and full rationale are in
      # the action; `CiProvisionsBdAndDoltTest` is the guard that keeps a new
      # repo-wide lane from being added without it.
      - uses: ./.github/actions/install-bd-dolt

      # `:kernel:test` is excluded here because it runs in its own required
      # `kernel-test` job below (computenet-dqy.16): it is the repo's largest
      # suite and used to serialise the last ~139s of this lane behind one
      # test JVM. `:kernel` still compiles here (its dependents need it);
      # only its test task moves.
      #
      # `--profile` writes an HTML task-execution report to
      # build/reports/profile. Uploaded below because per-task attribution from
      # log header timestamps is unreliable: in a non-tty plain-console log
      # Gradle emits the "Task :x" header with the task's first output, so a
      # task silent at lifecycle level gets its header at completion and its
      # wall time is mis-assigned to a neighbour (computenet-dqy.15 attributed
      # a full 30s task to the wrong task this way).
      - name: Build and check (fast lane — excludes multi-jvm-tagged tests)
        run: ./gradlew build check -PexcludeMultiJvm=true -x :kernel:test --profile

      # computenet-3g6n. The assertion below is a statement about the JUnit XML
      # sitting in `demo/beadsmirror/build/test-results/test`, and the step above
      # will happily put a REPLAYED report there: whether `bd`/`dolt` are on PATH
      # is not a declared input of `:demo:beadsmirror:test`, so the build cache
      # keys the task identically with and without the toolchain and restores
      # whichever report it holds. Both directions of that are real:
      #
      #  - a cached SKIPPED report replayed into a job whose install step ran —
      #    observed on PR #294 runs 32039390827 and 32040006148, `> Task
      #    :demo:beadsmirror:test FROM-CACHE` carrying `tests="1" skipped="1"`
      #    and `Assumption failed: bd is not on PATH — skipping`. That one goes
      #    red, loudly, but recovers only by touching a source file or clearing
      #    the Actions cache;
      #  - a cached GOOD report replayed into a job that ran nothing — measured
      #    locally 2026-08-17: with `/opt/homebrew/bin` off PATH and no
      #    `--rerun`, the step above's own invocation shape completed in 1s with
      #    `FROM-CACHE`, and the step below printed `ok: ...TwoNodeRigTest
      #    executed 5 test(s), 0 skipped`. That is the dangerous direction —
      #    green, silent, asserting about a report the job did not produce.
      #
      # `--rerun` is the fix the serial lane already carries (computenet-7em.5,
      # commit e0d8aab0). It binds to the single task preceding it and so cannot
      # be applied inside the repo-wide `build check` above, hence a second
      # invocation here.
      #
      # SCOPED TO THE ONE CLASS THE ASSERTION NAMES, deliberately. `--rerun` over
      # the whole module was measured at 9m46s on CI (run 32051833249's fast
      # lane, whose last 9 minutes are this one task: header at 17:47:46, BUILD
      # SUCCESSFUL at 17:56:45) against ~28s for a fully cached `build check`
      # (run 32041142119). Re-executing all 222 tests every PR to defend an
      # assertion about 5 of them is a 10x wall-time regression on a required
      # check; the filtered rerun costs ~1 test class. What it buys is exactly
      # what the criterion asks: the report the step below reads is one THIS job
      # produced, and TwoNodeRigTest carries the same `bd`/`dolt` assumptions as
      # the rest of the module, so an absent toolchain still reddens the lane
      # through check (3).
      #
      # Two consequences, stated because they are real losses and not oversights:
      #  - a Test task clears its results directory on execution, so after this
      #    step `test-results/test` holds ONLY TwoNodeRigTest. The aggregate line
      #    below therefore reads `5 tests` rather than `222`, and the uploaded
      #    fast-lane artifact carries only this class for this module (the serial
      #    lane's artifact and a local run still carry the whole suite).
      #  - check (2) below consequently ranges over this class alone, and for
      #    this class it CANNOT FIRE. The guards are the same two assumptions,
      #    but TwoNodeRigTest carries them in `@BeforeAll`, and a failed
      #    assumption in a class-level lifecycle method aborts the container —
      #    which Gradle records as a bare `<skipped/>`, without the assumption
      #    message check (2) greps for. Measured 2026-08-18 (darwin/arm64,
      #    /opt/homebrew/bin off PATH): this class's report holds five bare
      #    `<skipped/>` and zero occurrences of `is not on PATH`, while
      #    `feed.CheckpointResumeTest` — same module, same guards, but in
      #    `@BeforeEach` — run the same way holds
      #    `<skipped message="...Assumption failed: bd is not on PATH — skipping">`
      #    five times. So in THIS lane the toolchain signature is carried by
      #    check (3) alone, which does redden on that report (`5 test(s),
      #    5 skipped`, exit 1, measured the same way); check (2) here is inert
      #    in both directions and is kept only because the two lanes share this
      #    script. It stays live in build-test-serial, whose class guards per
      #    test. Follow-up: computenet-jx3g.
      #
      # `-PexcludeMultiJvm=true` is repeated because this is a separate Gradle
      # invocation; without it the filter would also match nothing new but the
      # lane's tag scoping would differ from the step above for no reason.
      - name: ":demo:beadsmirror e2e executed, never replayed (computenet-3g6n)"
        run: ./gradlew :demo:beadsmirror:test --tests 'civictech.demo.beadsmirror.e2e.TwoNodeRigTest' --rerun -PexcludeMultiJvm=true

      # computenet-dqj.14's third acceptance criterion: a skip for missing
      # `bd`/`dolt` must be visible in the gate's own run, not just locally
      # invisible-by-default the way it was before the install step above.
      #
      # computenet-7em.5 turned it from a report into an assertion. Publishing
      # a skipped count is not a gate: the observed failure it exists to catch
      # (run 32004218853, job 95310345107) was a *green* job — `BUILD
      # SUCCESSFUL` in 2m25s with the module's substantive e2e test reporting
      # SKIPPED — and a count nobody reads changes nothing about that. Its
      # acceptance criterion is explicit that "a failure of those suites SHALL
      # fail the check rather than being skipped", so a skip that means the
      # toolchain is absent has to be red.
      #
      # Three checks, in widening order of specificity:
      #
      #  1. no JUnit XML at all — `:demo:beadsmirror:test` did not run
      #     (computenet-dqj.14's original hard failure, kept verbatim).
      #  2. any test skipped with `is not on PATH` in its message — the exact
      #     signature of the install step above having been removed, reordered
      #     after the build, or silently failed. This is deliberately narrow:
      #     it does NOT fail on skips from this module's other assumptions
      #     (RebaselineTest's read-only-dir probe skips when running as root;
      #     BeadsMirrorAppTest's refusal test skips with no `.beads` above the
      #     cwd), which are environment facts rather than lost coverage.
      #
      #     **In THIS lane check (2) is inert, and check (3) is the gate**
      #     (computenet-jx3g). Two facts combine. First, the filtered `--rerun`
      #     step above *clears* this results directory before it writes —
      #     verified 2026-08-18 by planting a sentinel `TEST-*.xml` here and
      #     watching that invocation delete it — so the only report check (2)
      #     ever reads is TwoNodeRigTest's. Second, TwoNodeRigTest guards in
      #     `@BeforeAll`, and a failed assumption in a class-level lifecycle
      #     method aborts the *container*, which Gradle records as a bare
      #     `<skipped/>` carrying no message. Measured 2026-08-18 on
      #     darwin/arm64 with /opt/homebrew/bin off PATH: TwoNodeRigTest's XML
      #     was `tests="5" skipped="5"` with five bare `<skipped/>` elements
      #     and `grep -c 'is not on PATH'` = 0; the same invocation against
      #     CheckpointResumeTest, which guards in `@BeforeEach`, wrote
      #     `<skipped message="...Assumption failed: bd is not on PATH —
      #     skipping"...>` and grep = 5. So check (2) prints nothing here
      #     whether the toolchain is present or absent.
      #
      #     This is a loss of diagnostic specificity, not a gate hole: the
      #     toolchain-absent report is exactly the report check (3) reddens on
      #     (`FAIL: ...TwoNodeRigTest reports 5 test(s), 5 skipped`, exit 1,
      #     measured the same way), and since bd/dolt availability is
      #     TwoNodeRigTest's *only* assumption, "5 skipped" in this lane has
      #     no other cause to distinguish it from. The check is kept rather
      #     than deleted because it is not lane-specific by construction —
      #     it re-arms the moment this directory holds any `@BeforeEach`-
      #     guarded class again (drop the filtered rerun, add a second
      #     `--tests` selector, move TwoNodeRigTest's guards). It stays live
      #     unconditionally in build-test-serial, whose class guards per test.
      #  3. every class named in REQUIRED_CLASSES produced XML with tests>0 and
      #     skipped=0 — this lane's substantive e2e evidence, by name, so that
      #     a filter/tag/module-scoping change that quietly stops running it
      #     reddens the lane instead of passing green having asserted nothing.
      #
      # The named class differs per lane because the tag filter does: this lane
      # runs `-PexcludeMultiJvm=true`, so it owns TwoNodeRigTest (untagged) and
      # never sees TwoJvmMirrorTest; build-test-serial runs `-PmultiJvmOnly=true`
      # and owns exactly the reverse. Between the two required checks both of
      # the classes computenet-7em.5 names are asserted to have executed.
      #
      # Nothing here weakens the `assumeTrue` guards themselves — the same
      # binaries missing on a developer machine still skip, as computenet-7em.5's
      # third criterion requires. The gate is on CI's environment, not the test.
      - name: "Assert :demo:beadsmirror's e2e evidence ran (computenet-7em.5, computenet-dqj.14)"
        if: ${{ !cancelled() }}
        env:
          REQUIRED_CLASSES: civictech.demo.beadsmirror.e2e.TwoNodeRigTest
        run: |
          set -uo pipefail
          REPORT_DIR="demo/beadsmirror/build/test-results/test"
          failed=0

          if ! ls "$REPORT_DIR"/TEST-*.xml >/dev/null 2>&1; then
            echo "FAIL: no :demo:beadsmirror JUnit XML in $REPORT_DIR — :demo:beadsmirror:test did not run in this build" \
              | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          total=$(grep -oh 'tests="[0-9]*"' "$REPORT_DIR"/TEST-*.xml | grep -oE '[0-9]+' | awk '{s+=$1} END {print s+0}')
          skipped=$(grep -oh 'skipped="[0-9]*"' "$REPORT_DIR"/TEST-*.xml | grep -oE '[0-9]+' | awk '{s+=$1} END {print s+0}')
          {
            echo "demo:beadsmirror JUnit results: ${total} tests, ${skipped} skipped"
            if [ "$skipped" -gt 0 ]; then
              # `|| true`: `set -o pipefail` is on, so a grep chain that matches
              # nothing would otherwise be this step's exit status and redden a
              # required job over the shape of a diagnostic. Measured 2026-08-16
              # against fixtures: with the attribute order Gradle actually emits
              # (`<testcase name=... classname=...>`, `<skipped/>` either on its
              # own line or inlined) the chain matches; with `classname` before
              # `name` it matches nothing and the step exited 1 on an
              # otherwise-fine report. The order, not the line breaking, is what
              # decides it.
              grep -B1 '<skipped' "$REPORT_DIR"/TEST-*.xml | grep -E 'testcase name|message=' || true
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

          # (2) the toolchain-absence signature. Matched on the ASCII substring
          # only: the assumption message is `bd is not on PATH — skipping` with a
          # literal em dash, which is not worth putting in a grep pattern.
          # Verified 2026-08-17 against a real Gradle-emitted report produced by
          # running this module's serial-lane invocation with /opt/homebrew/bin
          # off PATH — the same shape the CI job produced on run 32004218853.
          #
          # Inert in THIS lane — see check (2)'s note above (computenet-jx3g):
          # the only report present is TwoNodeRigTest's, whose `@BeforeAll`
          # guard aborts the container and leaves message-less `<skipped/>`
          # elements. Check (3) below is what reddens the lane on that report.
          onpath=$(grep -l 'is not on PATH' "$REPORT_DIR"/TEST-*.xml || true)
          if [ -n "$onpath" ]; then
            {
              echo "FAIL: a :demo:beadsmirror test skipped itself because bd or dolt was not on PATH."
              echo "The 'Install bd and dolt' step in this job is what provisions them (computenet-7em.5)."
              echo "Without it this lane passes green having asserted nothing about the mirror. Reports affected:"
              echo "$onpath"
            } | tee -a "$GITHUB_STEP_SUMMARY"
            failed=1
          fi

          # (3) the named e2e classes must have executed, not merely been reported on.
          for cls in $REQUIRED_CLASSES; do
            xml="$REPORT_DIR/TEST-${cls}.xml"
            if [ ! -f "$xml" ]; then
              echo "FAIL: ${cls} produced no JUnit XML — it did not run in this lane." \
                | tee -a "$GITHUB_STEP_SUMMARY"
              failed=1
              continue
            fi
            t=$(grep -o 'tests="[0-9]*"' "$xml" | head -1 | grep -oE '[0-9]+')
            s=$(grep -o 'skipped="[0-9]*"' "$xml" | head -1 | grep -oE '[0-9]+')
            if [ "${t:-0}" -eq 0 ] || [ "${s:-0}" -gt 0 ]; then
              echo "FAIL: ${cls} reports ${t:-0} test(s), ${s:-0} skipped — this lane's substantive e2e evidence did not execute." \
                | tee -a "$GITHUB_STEP_SUMMARY"
              failed=1
            else
              echo "ok: ${cls} executed ${t} test(s), 0 skipped" | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          done

          exit "$failed"

      # A CI checkout is always a fresh clone, so this also enforces the
      # clean-clone guard: any load-bearing file that was never committed (the
      # class of bug this remediation fixed — CLAUDE.md, doc/ARCHITECTURE.md,
      # etc. were untracked in every checkout until now) shows up here as an
      # untracked file and fails the build.
      - name: Fail on unexpected untracked files
        run: test -z "$(git status --porcelain -uall -- doc '*/src')"

      # THE `:wire:` ROSTER, PUBLISHED ON GREEN TOO (computenet-dqy.55).
      #
      # The announcement-loss chain (computenet-dqy.40 / .52 / .53) now has
      # ~30,000 zero-loss awaits across three probe conditions against this
      # lane's own harvest of 2 losses in 450 awaits. Every probe arm to date
      # dispatches a `:wire:test` of its own; what none of them has been able to
      # check is whether THIS lane gives `WsAnnouncementStressTest` the same
      # co-tenants in the same order. The dispatched co-tenant arm measured it
      # as class 3 of 13 (computenet-dqy.53, run 31686209748) and review of
      # PR #90 reproduced that locally on darwin — but never on the fast lane
      # itself, because the diagnostic upload below fires only on
      # `failure() || cancelled()` and a green fast lane therefore publishes
      # nothing.
      #
      # This step is deliberately NARROW where that one is broad: `:wire:` only,
      # XML only, and it runs on green. That is the whole difference in cost —
      # 13 small files instead of every module's results — and it is what makes
      # the ordering comparable run to run instead of only when something broke.
      #
      # It reuses the probe's own roster script rather than re-deriving the
      # order here, so the fast lane's roster and the probe's are produced by
      # the same code and cannot disagree by accident. The script never fails a
      # run on the strength of a roster (see its docstring); the one case it
      # exits non-zero on is "no XML at all", which here means `:wire:test` did
      # not run, so the guard below owns that case and reports it without
      # reddening a lane whose own build already succeeded or already failed for
      # its own reasons. The guard tests for the XML itself, not for the
      # directory: Gradle can leave `test-results/test` behind holding only
      # `binary/` (a test JVM that died before writing a report, a run that was
      # interrupted), and a directory-only check would hand the script an empty
      # directory, take its exit 1, and turn a required check red over a
      # diagnostic. This step must never be the reason build-test-fast fails.
      - name: "Publish the fast lane's :wire: class order"
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          if ls wire/build/test-results/test/TEST-*.xml >/dev/null 2>&1; then
            python3 .github/scripts/announcement_probe_cotenancy.py \
              wire/build/test-results/test WsAnnouncementStressTest
          else
            echo "no :wire: JUnit XML in wire/build/test-results/test — :wire:test did not run in this build" \
              | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: "Upload :wire: test results (class order, published on success)"
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: wire-test-results-fast
          path: wire/build/test-results/test/*.xml
          if-no-files-found: warn
          retention-days: 14

      # Gradle writes the profile report when the build finishes, pass or fail;
      # `!cancelled()` keeps it for failed runs too, where attribution matters
      # most. `ignore` covers a run killed before the report exists.
      - name: Upload build profile report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: build-profile-fast
          path: build/reports/profile
          if-no-files-found: ignore
          retention-days: 14

      # The JUnit XML is the only place a hang explains itself. Two artefacts
      # live there and nowhere else (computenet-8ru.4):
      #
      #   - the SUPPRESSED InterruptedException that JUnit's InterruptTask
      #     attaches to the TimeoutException, carrying the blocked thread's real
      #     stack. Gradle's console stack filter drops the suppressed section
      #     unconditionally, so the console shows only `TimeoutException ... at
      #     ArrayList.forEach` and names nothing. Measured, not assumed: a local
      #     probe reproduced the CI signature exactly while the same run's
      #     TEST-*.xml named the real blocked frame.
      #   - the pre-interrupt thread dump `PreInterruptThreadDumpPrinter` writes
      #     to worker stdout (armed for :inspect in computenet-8ru.3). Gradle
      #     does not set showStandardStreams — deliberately, a blanket one would
      #     flood a suite this size — so stdout reaches the XML and not the log.
      #     Note it uses Thread.getAllStackTraces() and therefore OMITS virtual
      #     threads, so it is the weaker of the two.
      #
      # Uploaded only when the job did not succeed: a green run's XML is a large
      # artifact nobody reads. `cancelled()` sits alongside `failure()` so the
      # step fires whichever conclusion a `timeout-minutes` kill reports; steps
      # conditioned this way do execute inside the cancellation window (run
      # 31293198844 cancelled build-test-fast mid-build and its post-steps still
      # ran to success).
      #
      # But know what that branch can hold, because it is less than it looks.
      # Gradle materialises build/test-results at Test-TASK completion, not per
      # test: measured mid-task, the XML for the running module does not exist
      # yet and binary/*.bin are still 0 bytes. A mid-build kill therefore
      # yields the XML of modules that already finished and nothing for the one
      # actually hanging. The two artefacts above survive via `failure()`: a
      # method that trips the 5-minute JUnit timeout fails, its task completes,
      # and the XML is written — which is what run 31297641980 did. Treat
      # `cancelled()` as cheap insurance, not as a rescue of a hung module's
      # own evidence.
      #
      # XML only: build/reports/tests is a rendering of the same data, and
      # binary/ carries nothing extra at the moment a kill lands.
      - name: Upload test results (diagnostics for failed or hung runs)
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-fast
          path: "**/build/test-results/**/*.xml"
          if-no-files-found: ignore
          retention-days: 14

  # Kernel lane: only `:kernel:test`, split out of build-test-fast so the
  # repo's largest suite (157s of test events, ending when that build ends)
  # runs concurrently with the rest of the fast lane instead of serialising
  # behind it (computenet-dqy.16). This check name is in the protected-branch
  # ruleset's required set, and build-test-fast excludes :kernel:test, so
  # this job is the sole merge gate for the kernel suite — do not remove or
  # rename it without updating both.
  kernel-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Same `cache-encryption-key` rationale as the fast lane above. This lane
      # was split out (computenet-dqy.16) after computenet-aer added the key to
      # the other three, so it is included here to keep every Gradle lane on
      # the same configuration-cache footing.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Kernel test suite
        run: ./gradlew :kernel:test -PexcludeMultiJvm=true

      # Same rationale as the fast lane above: the JUnit XML is the only place
      # a hang explains itself.
      - name: Upload test results (diagnostics for failed or hung runs)
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-kernel
          path: "**/build/test-results/**/*.xml"
          if-no-files-found: ignore
          retention-days: 14

  # Serial lane: only the two-JVM/ProcessBuilder tests (`ExchangeScaffoldTest`,
  # `TwoJvmConvergenceTest`, `CrashRestartConvergenceTest`), --max-workers=1 to
  # remove Gradle's own cross-project scheduling as a contention source — the
  # variable T13 diagnosed as the runner-contention cause of the repo's one
  # (failing) CI run to date. These tests fork external `java` processes and
  # wait on fixed wall-clock awaits for OS-level process startup, which is
  # exactly what a starved runner (compounded by org.gradle.parallel=true
  # scheduling sibling module test tasks concurrently) starves hardest. `ubuntu-latest`
  # is the 4-vCPU/16-GB standard runner tier here, not the 2-vCPU/8-GB one, because
  # this repo is public (`gh repo view --json isPrivate` -> false) — GitHub docs give
  # private repos the smaller tier and public repos the larger one for the same label.
  # Measured, not only read: `announcement-probe.yml`'s sampler on run 31673273722
  # printed `runner: 4 cores` and `Mem: 15989` MB on this repo's `ubuntu-latest`.
  # buildSrc/src/main/kotlin/kotlin-jvm.gradle.kts's `maxParallelForks` clamp and
  # gradle.properties' daemon heap sizing are both sized against this 4/16 budget;
  # re-check both if the tier the repo gets ever changes (e.g. going private).
  build-test-serial:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # `cache-encryption-key` lets setup-gradle save/restore the project's
      # .gradle/configuration-cache directory, which it refuses to cache
      # unencrypted because a configuration-cache entry can capture secrets.
      # Without it every run recomputed ~12.7s of configuration per Gradle lane
      # despite org.gradle.configuration-cache=true (computenet-aer). If the
      # GRADLE_ENCRYPTION_KEY secret is unset the input is an empty string,
      # which setup-gradle coerces to undefined (`getCacheEncryptionKey() ||
      # undefined`) — it degrades to the old no-config-cache-save behavior
      # rather than failing.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      # Same action as build-test-fast above, for the same reason: this lane's
      # only :demo:beadsmirror class, TwoJvmMirrorTest, is `assumeTrue`-guarded
      # on both binaries, so without them the lane runs it, reports SKIPPED and
      # passes (observed, run 32004218853 job 95310345107 — computenet-7em.5).
      - uses: ./.github/actions/install-bd-dolt

      # The multi-jvm classes live only in :demo:exchange, :demo:shopping and
      # :demo:beadsmirror, yet this lane used to run repo-wide `check` under
      # --max-workers=1: every module compiled serially plus ten empty
      # test-JVM forks, ~190s of overhead for ~16s of actual multi-jvm testing
      # (measured, run 31572635923). The guard keeps the scoping honest: a
      # multi-jvm-tagged test added in any other module fails this step
      # instead of silently never running.
      #
      # :demo:beadsmirror is scoped in here for correctness. Until
      # computenet-7em.5 it bought no coverage on this runner: its only
      # multi-jvm class (TwoJvmMirrorTest) is assumeTrue-guarded on `bd` and
      # `dolt` being on PATH and this image installed neither, so the lane ran
      # it and it reported SKIPPED while the job passed green (observed, run
      # 32004218853 job 95310345107). The install step above provisions both,
      # and the assertion step at the end of this job makes a repeat of that
      # skip red rather than green.
      - name: Guard - multi-jvm tests live only in the scoped modules
        run: |
          stray=$(grep -rl 'Tag("multi-jvm")' --include='*.kt' --exclude-dir=build . | grep -vE '^\./demo/(shopping|exchange|beadsmirror)/' || true)
          if [ -n "$stray" ]; then
            echo "multi-jvm-tagged tests outside the serial lane's scoped modules — widen the module list in this job:"
            echo "$stray"
            exit 1
          fi

      # Two phases: compile the dependency closure with full parallelism, then
      # run only the three owning modules' tests at one worker — the quiet-VM
      # property T13 asked for applies to the process-forking tests themselves,
      # not to compilation.
      - name: Compile the multi-jvm closure (parallel)
        run: ./gradlew :demo:exchange:testClasses :demo:shopping:testClasses :demo:beadsmirror:testClasses

      # `--rerun` binds to the task immediately before it, so it applies to
      # :demo:beadsmirror:test alone and exchange/shopping keep their cache.
      # It is load-bearing, not hygiene: whether `bd` is on PATH is NOT a
      # declared input of the test task, so a build-cache entry recorded before
      # the install step above existed replays its SKIPPED report verbatim.
      # Observed on this PR's own first run (32039390827, job 95415894698):
      # install step green, `:demo:beadsmirror:test FROM-CACHE`, and the
      # assertion below correctly went red on a one-test/one-skipped report the
      # lane never produced. Cached-and-skipped is exactly the false green
      # computenet-7em.5 exists to remove, so this lane executes the class every
      # time (~30s locally) rather than trusting a replay of it.
      - name: Multi-JVM serial lane (process-startup + wall-clock timing tests)
        run: ./gradlew :demo:exchange:test :demo:shopping:test :demo:beadsmirror:test --rerun -PmultiJvmOnly=true --max-workers=1

      # computenet-7em.5. Same three checks as build-test-fast's copy of this
      # step — read that one for the reasoning — with the named class flipped,
      # because `-PmultiJvmOnly=true` means this lane runs exactly the class the
      # fast lane excludes and nothing else from this module. Keeping the two
      # steps in the same shape is also what makes a drift between the two
      # install steps show up as a red lane rather than as a lane that reports
      # a skipped count and shrugs.
      - name: "Assert :demo:beadsmirror's e2e evidence ran (computenet-7em.5)"
        if: ${{ !cancelled() }}
        env:
          REQUIRED_CLASSES: civictech.demo.beadsmirror.e2e.TwoJvmMirrorTest
        run: |
          set -uo pipefail
          REPORT_DIR="demo/beadsmirror/build/test-results/test"
          failed=0

          if ! ls "$REPORT_DIR"/TEST-*.xml >/dev/null 2>&1; then
            echo "FAIL: no :demo:beadsmirror JUnit XML in $REPORT_DIR — :demo:beadsmirror:test did not run in this build" \
              | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          total=$(grep -oh 'tests="[0-9]*"' "$REPORT_DIR"/TEST-*.xml | grep -oE '[0-9]+' | awk '{s+=$1} END {print s+0}')
          skipped=$(grep -oh 'skipped="[0-9]*"' "$REPORT_DIR"/TEST-*.xml | grep -oE '[0-9]+' | awk '{s+=$1} END {print s+0}')
          {
            echo "demo:beadsmirror JUnit results (serial lane): ${total} tests, ${skipped} skipped"
            if [ "$skipped" -gt 0 ]; then
              grep -B1 '<skipped' "$REPORT_DIR"/TEST-*.xml | grep -E 'testcase name|message=' || true
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

          onpath=$(grep -l 'is not on PATH' "$REPORT_DIR"/TEST-*.xml || true)
          if [ -n "$onpath" ]; then
            {
              echo "FAIL: a :demo:beadsmirror test skipped itself because bd or dolt was not on PATH."
              echo "The 'Install bd and dolt' step in this job is what provisions them (computenet-7em.5)."
              echo "Without it this lane passes green having asserted nothing about the mirror. Reports affected:"
              echo "$onpath"
            } | tee -a "$GITHUB_STEP_SUMMARY"
            failed=1
          fi

          for cls in $REQUIRED_CLASSES; do
            xml="$REPORT_DIR/TEST-${cls}.xml"
            if [ ! -f "$xml" ]; then
              echo "FAIL: ${cls} produced no JUnit XML — it did not run in this lane." \
                | tee -a "$GITHUB_STEP_SUMMARY"
              failed=1
              continue
            fi
            t=$(grep -o 'tests="[0-9]*"' "$xml" | head -1 | grep -oE '[0-9]+')
            s=$(grep -o 'skipped="[0-9]*"' "$xml" | head -1 | grep -oE '[0-9]+')
            if [ "${t:-0}" -eq 0 ] || [ "${s:-0}" -gt 0 ]; then
              echo "FAIL: ${cls} reports ${t:-0} test(s), ${s:-0} skipped — this lane's substantive e2e evidence did not execute." \
                | tee -a "$GITHUB_STEP_SUMMARY"
              failed=1
            else
              echo "ok: ${cls} executed ${t} test(s), 0 skipped" | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          done

          exit "$failed"

      # Same rationale as the fast lane above. This lane is where the
      # process-kill/relaunch tests live, so it is the likeliest to hang.
      - name: Upload test results (diagnostics for failed or hung runs)
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-serial
          path: "**/build/test-results/**/*.xml"
          if-no-files-found: ignore
          retention-days: 14

  concord-full:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # `cache-encryption-key` lets setup-gradle save/restore the project's
      # .gradle/configuration-cache directory, which it refuses to cache
      # unencrypted because a configuration-cache entry can capture secrets.
      # Without it every run recomputed ~12.7s of configuration per Gradle lane
      # despite org.gradle.configuration-cache=true (computenet-aer). If the
      # GRADLE_ENCRYPTION_KEY secret is unset the input is an empty string,
      # which setup-gradle coerces to undefined (`getCacheEncryptionKey() ||
      # undefined`) — it degrades to the old no-config-cache-save behavior
      # rather than failing.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Run full concord corpus (core, dist, dur)
        run: ./gradlew :concord:test -Pconcord.profiles=core,dist,dur

      - name: Regenerate concordance matrix
        run: ./gradlew :concord:concordance

      # Regeneration must be a no-op: if this diffs, doc/spec/CONCORDANCE.md
      # drifted from the corpus and was hand-edited or left stale.
      - name: Confirm concordance regeneration is a no-op
        run: git diff --exit-code doc/spec/CONCORDANCE.md

      # Same rationale as the fast lane above. The corpus runs under the same
      # 5-minute per-method timeout, so it can hang the same way.
      - name: Upload test results (diagnostics for failed or hung runs)
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-concord
          path: "**/build/test-results/**/*.xml"
          if-no-files-found: ignore
          retention-days: 14

  ui-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: inspect/ui/.nvmrc
          cache: npm
          cache-dependency-path: inspect/ui/package-lock.json

      - name: Install dependencies
        working-directory: inspect/ui
        run: npm ci

      - name: Typecheck
        working-directory: inspect/ui
        run: npm run typecheck

      - name: Test
        working-directory: inspect/ui
        run: npm test

  agora-ui-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: demo/agora/ui/.nvmrc
          cache: npm
          cache-dependency-path: demo/agora/ui/package-lock.json

      - name: Install dependencies
        working-directory: demo/agora/ui
        run: npm ci

      - name: Typecheck
        working-directory: demo/agora/ui
        run: npm run typecheck

      - name: Test
        working-directory: demo/agora/ui
        run: npm test
