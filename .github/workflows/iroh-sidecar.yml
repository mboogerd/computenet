name: iroh-sidecar

# What this job measures for computenet-egl.6: Linux x64 native `cargo build`
# and `cargo test` wall time for the iroh/sidecar crate, cold (no rust-cache
# hit) and warm (cache hit) — labeled per-step so each figure can be cited
# naming the run it came from. It is also the first-ever non-macOS execution
# of the crate's tests; developer machines only cover macOS arm64. There is
# NO cross-compilation here: this job runs two *native* builds (a direct
# `cargo build`/`cargo test` pair, then a redundant native rebuild driven by
# `./gradlew :iroh:check -Piroh.enabled=true` to prove the Gradle flag wiring
# works) — the residue finding (egl.6) reports that duplication as the
# measured burden, not a defect of this job.
#
# REQUIRED as of 2026-08-31 (computenet-eys1.1): this workflow's `iroh-sidecar`
# job is now listed in ruleset 20149495's required_status_checks, alongside
# build-test-fast, build-test-serial, concord-full, ui-test, agora-ui-test,
# and kernel-test — seven required contexts total. Re-run evidence (the
# AGENTS.md ruleset query):
#
#   GH_PAGER=cat gh api repos/mboogerd/computenet/rulesets/20149495 \
#     | jq -r '.rules[]|select(.type=="required_status_checks")
#              |.parameters.required_status_checks[].context'
#   -> build-test-fast
#      build-test-serial
#      concord-full
#      agora-ui-test
#      ui-test
#      kernel-test
#      iroh-sidecar
#
# Decided (2026-08-31, sync-report follow-up): warm runs of this lane measured
# ~2m10s-2m50s over 10 recent PRs (this workflow's own timed steps corroborate
# that figure); acceptable added latency on every required PR. This job is the
# ONLY place the sidecar-backed JVM tests (run below under
# `:iroh:check -Piroh.enabled=true`) execute — none of the other six required
# lanes passes `-Piroh.enabled`, so they build/run only :iroh's
# flag-independent sources (SidecarCodecTest and IrohSessionHelloTest); every
# other test class in the module — including IrohPeeringTest, IrohReconnectTest,
# SidecarExchangeTest and SidecarHandshakeTest — runs only here. A Linux
# regression in IrohTransport, SidecarClient or SidecarProcess now blocks
# auto-merge, as intended. (Deliberately no test-count figure: annotation
# counts and executed counts have drifted apart before — computenet-5erzg —
# so this comment states the coverage split instead of a number that goes
# stale. For the executed count on a given run, read the `:iroh:test` step's
# PASSED/FAILED/SKIPPED tally in that run's job log.)
#
# A cold run (cache miss) is not yet measured here; the 20-minute job timeout
# above is the current backstop. If a cold run turns out to dominate merge
# latency in practice, that is grounds to revisit this decision — not a
# reason it was wrong to make now.
#
# The beadsmirror iroh convergence suite (bd+dolt+sidecar together) IS wired
# into this job (computenet-cqde, after computenet-egl.4 landed as #598): the
# "beadsmirror iroh convergence suite" step below runs
# IrohConvergenceSuiteTest's four cases and IrohMirrorTransportTest under
# `-Piroh.enabled=true`, with `bd`/`dolt` provisioned via the same
# `install-bd-dolt` composite action ci.yml's beadsmirror lanes use, and the
# same step runs DiscoveredIrohConvergenceSuiteTest's four cases (the same
# suite over a peering formed by `--offline --mdns` discovery, computenet-63um5
# — 12 tests in the step, not 8; they SKIP on a macOS host without multicast
# delivery and must EXECUTE here, since ubuntu-latest delivers it), and the
# following step asserts (via `assert-beadsmirror-e2e`) that no named class
# reported itself skipped — a Linux run of these cases with the toolchain
# absent fails the job rather than passing green having asserted nothing,
# same shape as computenet-7em.5 for the WS-transport suites. That suite was
# once this lane's only reason `demo/beadsmirror/**` was also a trigger path;
# there is no `paths:` filter here any more (see below), so nothing is
# path-scoped now — the sentence survives only to say why these steps exist.
#
# Where a warm (cache-hit=true) figure comes from (computenet-jtvd): this
# workflow only triggers on pull_request, so it never writes a main-scoped
# rust-cache entry itself, and a PR's first run here is cold by construction.
# cache-seed.yml runs an `iroh-sidecar` job under the same job id, toolchain
# and `workspaces: iroh/sidecar` on a daily schedule from main, so its saved
# Swatinem/rust-cache entry is the one this job's cache-hit lookup restores
# from — the same pattern this file's own cache-seed.yml header describes for
# the Gradle lanes. A warm figure therefore requires either a PR run after
# cache-seed.yml has run at least once post-merge, or a second run on the
# same PR ref (which restores the first run's own PR-scoped cache entry).
#
# NO `paths:` FILTER, deliberately (computenet-b6hu). This job is a REQUIRED
# status check (see the header above), and GitHub does not treat an absent
# required check as satisfied: a path-filtered required workflow simply never
# reports on a PR outside its paths, and that PR stays `mergeStateStatus:
# BLOCKED` forever with every other check green. Measured 2026-08-31: with the
# filter in place, PR #601 (query/** only) held all six other required checks
# SUCCESS and auto-merge armed, and sat BLOCKED indefinitely with no
# `iroh-sidecar` row in its `statusCheckRollup` at all; #587 was in the same
# state. Running on every PR is what the promotion decision already priced in
# ("acceptable added latency on every required PR").
#
# WHAT THAT LATENCY ACTUALLY IS, re-measured at review time on a PR whose diff
# touches no iroh source at all (PR #604, run 33379105667, job 99447143947 —
# only this file and AGENTS.md changed): job wall 3m45s (09:43:49-09:47:34Z),
# rust cache "full match: true" from the main-scoped cache-seed entry, so this
# is a WARM run. Step timings: cargo-build 14s, cargo-test 6s,
# gradle-iroh-check 109s, the rest checkout/toolchain/Gradle setup and the
# beadsmirror convergence suite. The ~2m10s-2m50s warm figure in the header
# above predates the beadsmirror convergence step (computenet-cqde, #599) and
# therefore UNDERSTATES the current cost by roughly a minute; 3m45s warm is the
# figure to reason with, and every merge now pays it. A cold run remains
# unmeasured, with the 20-minute job timeout as its only backstop, and cold is
# now reachable on ANY PR rather than only iroh-touching ones — if cache-seed
# has not run since a Cargo.lock or toolchain change, the whole repository's
# merge latency inherits that unmeasured cost.
#
# Re-adding a `paths:` filter here re-breaks every non-iroh PR in the
# repository — remove the check from ruleset 20149495 first if that is ever
# the intent.
#
# UPDATE (2026-09-01, computenet-o0m3.4): as of this change, the JVM-driven
# test steps below ("iroh Gradle check, flag-enabled" and "beadsmirror iroh
# convergence suite") no longer run against n0's public relay/discovery
# infrastructure, contrary to what earlier revisions of doc/iroh-adoption.md
# recorded as this lane's behaviour. A new step starts a job-local,
# self-hosted `computenet-iroh-relay` right after `cargo build`, both Gradle
# invocations receive its URL via `-Piroh.relay.url`, and a liveness check
# after the Gradle steps reddens the job if that relay process died —
# without which the self-hosting claim would be unverifiable, since peers in
# these suites still hold direct loopback addresses via ADD_PEER and would
# pass identically against a dead relay. See doc/iroh-adoption.md's
# "Documented default for ComputeNet development" section for the same
# update recorded from the adoption-policy side.
#
# UPDATE (2026-09-21, computenet-vnscs): the JVM-driven test steps below now
# also spawn every sidecar under `LookupMode::Rendezvous`, publishing to and
# resolving through a job-local, self-hosted `computenet-iroh-dns` (pkarr
# relay + DNS on loopback, no TLS) rather than n0's public infrastructure,
# with a liveness check reddening the job if that server died mid-run. The
# development default outside this CI lane stays `LookupMode::N0` (F2-D7,
# aas-D9) — this is lane configuration, not a change to that policy.
on:
  pull_request:
  workflow_dispatch: {}

# Same idiom as ci.yml: supersede an in-flight run when a newer commit lands
# on the same ref, except on `main` where a run is left to complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  iroh-sidecar:
    runs-on: ubuntu-latest
    # ESTIMATED (egl.5-D2): under 10 minutes cold. The timed steps below are
    # what corrects this estimate with a measured figure.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Provisions `bd` and `dolt` for the "beadsmirror iroh convergence
      # suite" step near the bottom of this job — see that action's header
      # (computenet-mgxe) for why it is a composite action rather than a
      # copy-pasted step, and ci.yml for the same pairing over the
      # WS-transport suites. Installed early so it is available regardless of
      # step ordering changes below; it costs well under 10s (two curls, no
      # build-from-source).
      - uses: ./.github/actions/install-bd-dolt

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Rust cache
        id: rust-cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: iroh/sidecar

      - name: cargo build (timed)
        working-directory: iroh/sidecar
        run: |
          set -euo pipefail
          start=$(date +%s)
          cargo build
          end=$(date +%s)
          line="iroh-sidecar-timing step=cargo-build seconds=$((end - start)) cache-hit=${{ steps.rust-cache.outputs.cache-hit }}"
          echo "$line"
          echo "$line" >> "$GITHUB_STEP_SUMMARY"

      # computenet-2wmp5: `-- --nocapture` and the tee into
      # /tmp/iroh-sidecar-cargo-test.log exist so the next step can tell an
      # executed tests/mdns.rs from a skipped one. libtest captures and
      # discards a PASSING test's stdout/stderr, and tests/mdns.rs's
      # DSC2-NV-01 multicast-delivery gate skips (prints `SKIPPED
      # tests/mdns.rs: ...` to stderr, then returns Ok) rather than fails when
      # a host cannot deliver multicast — a skip IS a pass, so a plain
      # `cargo test`'s log has no textual difference between "the body ran"
      # and "the gate refused"; only elapsed time did, which the bead this
      # step closes (computenet-2wmp5) documents as inadequate on its own.
      - name: cargo test (timed)
        working-directory: iroh/sidecar
        run: |
          set -euo pipefail
          start=$(date +%s)
          cargo test -- --nocapture 2>&1 | tee /tmp/iroh-sidecar-cargo-test.log
          end=$(date +%s)
          line="iroh-sidecar-timing step=cargo-test seconds=$((end - start)) cache-hit=${{ steps.rust-cache.outputs.cache-hit }}"
          echo "$line"
          echo "$line" >> "$GITHUB_STEP_SUMMARY"

      # computenet-2wmp5: reddens the job, rather than only logging, when
      # tests/mdns.rs's delivery gate skips on this runner. Same "a vacuous
      # pass is a CI regression, not a silently accepted downgrade" reasoning
      # this file already applies below via "Assert the iroh convergence
      # suite actually ran" (computenet-cqde) and ci.yml applies to the
      # WS-transport suites (computenet-7em.5) — chosen over leaving the skip
      # merely visible because every observed run of this lane has delivered
      # real multicast (computenet-ne2oh's feature review, run 35499476852:
      # the JVM twin `MulticastGate` passed live in the SAME job, and this
      # test's own elapsed time matched neither skip shape), so a skip here
      # is evidence the runner regressed, not evidence of an expected
      # environment limit. This step does NOT touch tests/mdns.rs itself: a
      # developer machine that genuinely lacks multicast still gets a passing
      # skip there, per [DSC2-NV-01] — only this CI lane treats that same
      # skip as a failure.
      - name: Assert tests/mdns.rs actually exercised multicast delivery
        run: |
          set -euo pipefail
          if [ ! -f /tmp/iroh-sidecar-cargo-test.log ]; then
            echo "the cargo test log is absent — the 'cargo test (timed)' step did not tee it" >&2
            exit 1
          fi
          if grep -q 'SKIPPED tests/mdns.rs' /tmp/iroh-sidecar-cargo-test.log; then
            echo "tests/mdns.rs skipped on this CI runner:" >&2
            grep 'SKIPPED tests/mdns.rs' /tmp/iroh-sidecar-cargo-test.log >&2
            echo "ubuntu-latest has delivered multicast on every run observed so far (computenet-2wmp5); treating this as a CI regression rather than a silent pass. See tests/mdns.rs's module doc comment for the discriminator this step relies on." >&2
            exit 1
          fi
          echo "iroh-sidecar-mdns-nonvacuous: tests/mdns.rs executed (no 'SKIPPED tests/mdns.rs' line in the --nocapture log)"

      # computenet-o0m3.4: starts a job-local, self-hosted relay so no
      # JVM-driven sidecar in the two Gradle steps below has to reach n0's
      # public relay/discovery infrastructure. `cargo build` above already
      # produced target/debug/computenet-iroh-relay (a plain `cargo build`
      # with no `--bin` builds every binary target in the crate, including
      # src/bin/relay.rs). The binary writes exactly one JSON line before it
      # starts serving —
      # `{"port":<n>,"relayUrl":"http://127.0.0.1:<n>"}` — verified by
      # running it directly during this task's implementation (see
      # iroh/sidecar/src/bin/relay.rs's own doc comment, which states the
      # same shape). This step fails the job if that line never appears
      # within the bounded wait below, or if the process exits first.
      - name: Start job-local iroh relay
        working-directory: iroh/sidecar
        run: |
          set -euo pipefail
          nohup ./target/debug/computenet-iroh-relay --port 0 \
            > /tmp/iroh-relay.out 2> /tmp/iroh-relay.err &
          relay_pid=$!

          relay_url=""
          for _ in $(seq 1 50); do
            if [ -s /tmp/iroh-relay.out ]; then
              relay_url=$(grep -oE '"relayUrl":"[^"]+"' /tmp/iroh-relay.out | cut -d'"' -f4 || true)
              [ -n "$relay_url" ] && break
            fi
            if ! kill -0 "$relay_pid" 2>/dev/null; then
              echo "computenet-iroh-relay exited before printing its announcement line:" >&2
              cat /tmp/iroh-relay.err >&2
              exit 1
            fi
            sleep 0.2
          done

          if [ -z "$relay_url" ]; then
            echo "timed out waiting for computenet-iroh-relay's announcement line" >&2
            echo "--- stdout ---" >&2
            cat /tmp/iroh-relay.out >&2
            echo "--- stderr ---" >&2
            cat /tmp/iroh-relay.err >&2
            exit 1
          fi

          line="iroh-sidecar-relay pid=$relay_pid url=$relay_url"
          echo "$line"
          echo "$line" >> "$GITHUB_STEP_SUMMARY"
          echo "RELAY_URL=$relay_url" >> "$GITHUB_ENV"
          echo "RELAY_PID=$relay_pid" >> "$GITHUB_ENV"

      # computenet-vnscs: starts a job-local, self-hosted pkarr relay + DNS
      # server so the JVM-driven sidecars spawned in the two Gradle steps
      # below can run under `LookupMode::Rendezvous` without reaching n0's
      # public rendezvous infrastructure. `cargo build` above already
      # produced target/debug/computenet-iroh-dns (a plain `cargo build`
      # builds every binary target in the crate, including src/bin/dns.rs).
      # The binary writes exactly one JSON line before it starts serving —
      # `{"port":<n>,"pkarrRelayUrl":"http://127.0.0.1:<n>/pkarr","dnsOrigin":"irohdns.example.","dnsAddr":"127.0.0.1:<m>"}`
      # — see iroh/sidecar/src/bin/dns.rs's own doc comment, which states the
      # same shape and field order. This step fails the job, dumping both
      # logs, if that line never appears within the bounded wait below or if
      # the process exits first — it does not leave PKARR_URL/DNS_ORIGIN/
      # DNS_ADDR unset for a later step to trip over.
      - name: Start job-local iroh dns (pkarr relay + DNS)
        working-directory: iroh/sidecar
        run: |
          set -euo pipefail
          nohup ./target/debug/computenet-iroh-dns --port 0 \
            > /tmp/iroh-dns.out 2> /tmp/iroh-dns.err &
          dns_pid=$!

          pkarr_url=""
          dns_origin=""
          dns_addr=""
          for _ in $(seq 1 50); do
            if [ -s /tmp/iroh-dns.out ]; then
              pkarr_url=$(grep -oE '"pkarrRelayUrl":"[^"]+"' /tmp/iroh-dns.out | cut -d'"' -f4 || true)
              dns_origin=$(grep -oE '"dnsOrigin":"[^"]+"' /tmp/iroh-dns.out | cut -d'"' -f4 || true)
              dns_addr=$(grep -oE '"dnsAddr":"[^"]+"' /tmp/iroh-dns.out | cut -d'"' -f4 || true)
              [ -n "$pkarr_url" ] && [ -n "$dns_origin" ] && [ -n "$dns_addr" ] && break
            fi
            if ! kill -0 "$dns_pid" 2>/dev/null; then
              echo "computenet-iroh-dns exited before printing its announcement line:" >&2
              cat /tmp/iroh-dns.err >&2
              exit 1
            fi
            sleep 0.2
          done

          if [ -z "$pkarr_url" ] || [ -z "$dns_origin" ] || [ -z "$dns_addr" ]; then
            echo "timed out waiting for computenet-iroh-dns's announcement line" >&2
            echo "--- stdout ---" >&2
            cat /tmp/iroh-dns.out >&2
            echo "--- stderr ---" >&2
            cat /tmp/iroh-dns.err >&2
            exit 1
          fi

          line="iroh-sidecar-dns pid=$dns_pid pkarr=$pkarr_url origin=$dns_origin dns=$dns_addr"
          echo "$line"
          echo "$line" >> "$GITHUB_STEP_SUMMARY"
          echo "PKARR_URL=$pkarr_url" >> "$GITHUB_ENV"
          echo "DNS_ORIGIN=$dns_origin" >> "$GITHUB_ENV"
          echo "DNS_ADDR=$dns_addr" >> "$GITHUB_ENV"
          echo "DNS_PID=$dns_pid" >> "$GITHUB_ENV"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Same `cache-encryption-key` rationale as ci.yml's lanes: without it,
      # setup-gradle refuses to save/restore the encrypted configuration-cache
      # directory. If GRADLE_ENCRYPTION_KEY is unset this is an empty string,
      # which setup-gradle coerces to undefined and degrades gracefully.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      # Re-runs cargo build/test under the iroh.enabled flag's Exec tasks.
      # That is redundant work relative to the two steps above — it exists to
      # prove the Gradle flag wiring itself works on Linux, not to save time
      # (iroh/build.gradle.kts's own comment makes the same point about
      # cargoTest re-building). Since computenet-egl.2, :iroh applies
      # buildsrc.convention.kotlin-jvm, so `:iroh:check` now also runs
      # `:iroh:test` — the module's JVM tests, including IrohPeeringTest,
      # IrohReconnectTest, SidecarExchangeTest and SidecarHandshakeTest (no
      # fixed count here; see the header's note on why, computenet-5erzg).
      # `check` is still the right target (it subsumes `test` plus the
      # cargoTest wiring), not a substitute for a missing `:iroh:test` task.
      # See the workflow header (computenet-eys1) for the coverage and
      # required-check consequences of that, and the parked promotion
      # decision.
      - name: iroh Gradle check, flag-enabled (timed)
        run: |
          set -euo pipefail
          start=$(date +%s)
          ./gradlew :iroh:check -Piroh.enabled=true -Piroh.relay.url="$RELAY_URL" \
            -Piroh.pkarr.url="$PKARR_URL" -Piroh.dns.origin="$DNS_ORIGIN" -Piroh.dns.nameserver="$DNS_ADDR"
          end=$(date +%s)
          line="iroh-sidecar-timing step=gradle-iroh-check seconds=$((end - start)) cache-hit=${{ steps.rust-cache.outputs.cache-hit }}"
          echo "$line"
          echo "$line" >> "$GITHUB_STEP_SUMMARY"

      # computenet-6buf: the only Linux run of :iroh's JUnit suite (see the
      # "iroh Gradle check, flag-enabled" step above) otherwise has its exact
      # per-testcase `time` attributes torn down with the runner. `if:
      # always()` because the run whose timings matter most for flake
      # characterisation is a FAILING one, and a default (no-if) upload step
      # is skipped once a prior step fails — the whole point of this artifact
      # is to survive that case. 90-day retention (GitHub's default is also
      # 90, made explicit here rather than left implicit): the intended
      # consumer is cross-run flake characterisation over weeks, not
      # same-day debugging (computenet-merg reached back to 2026-08-29 and
      # wanted more history, not less), and log retention is a separate
      # setting from artifact retention — this only governs the artifact.
      - name: Upload :iroh JUnit XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iroh-test-results
          path: iroh/build/test-results/test/
          if-no-files-found: warn
          retention-days: 90

      # computenet-cqde: the only place IrohConvergenceSuiteTest's four cases
      # and IrohMirrorTransportTest's sidecar-backed case execute anywhere
      # besides a developer's darwin/arm64 machine — and, since
      # computenet-63um5, the only place DiscoveredIrohConvergenceSuiteTest's
      # four cases execute at all (mDNS; darwin SKIPs them, ne2oh-B6). `-Piroh.enabled=true`
      # makes :demo:beadsmirror depend on `:iroh:cargoBuild` and sets the
      # `iroh.sidecar.binary` system property (demo/beadsmirror/build.gradle.kts)
      # — a third cargo build in this job, redundant with the two steps above
      # in the same way the egl.6 header already documents `:iroh:check`
      # being redundant with the direct `cargo build`/`cargo test` pair; not a
      # new kind of duplication. `--rerun` because Gradle's up-to-date
      # checking would otherwise let a cached prior result stand in for
      # actually executing these classes on this runner.
      - name: beadsmirror iroh convergence suite (bd+dolt+sidecar together)
        run: |
          set -euo pipefail
          ./gradlew :demo:beadsmirror:test -Piroh.enabled=true -Piroh.relay.url="$RELAY_URL" \
            -Piroh.pkarr.url="$PKARR_URL" -Piroh.dns.origin="$DNS_ORIGIN" -Piroh.dns.nameserver="$DNS_ADDR" --rerun \
            --tests 'civictech.demo.beadsmirror.e2e.IrohConvergenceSuiteTest' \
            --tests 'civictech.demo.beadsmirror.e2e.DiscoveredIrohConvergenceSuiteTest' \
            --tests 'civictech.demo.beadsmirror.IrohMirrorTransportTest'

      # Non-vacuity assertion (computenet-cqde's acceptance clause 3): reddens
      # this job, rather than logging, when either class above reports itself
      # skipped — e.g. `bd`/`dolt` missing from PATH (the `install-bd-dolt`
      # step above not having run) or the sidecar binary absent. Same
      # composite action ci.yml's beadsmirror lanes use for the WS-transport
      # suites (computenet-7em.5/q4qt); read its header for the three checks
      # it runs. `report-dir` is left at its default
      # (demo/beadsmirror/build/test-results/test), which this module does
      # not override.
      - name: Assert the iroh convergence suite actually ran (non-vacuous)
        uses: ./.github/actions/assert-beadsmirror-e2e
        with:
          required-classes: >-
            civictech.demo.beadsmirror.e2e.IrohConvergenceSuiteTest
            civictech.demo.beadsmirror.e2e.DiscoveredIrohConvergenceSuiteTest
            civictech.demo.beadsmirror.IrohMirrorTransportTest

      # computenet-o0m3.4: the ONLY thing in this job that makes the
      # self-hosting claim non-vacuous. Every peer above still carries a
      # direct loopback address via ADD_PEER, so both Gradle steps would pass
      # exactly the same with a dead relay — a green run up to this point
      # proves nothing about the relay on its own. `kill -0` on the pid this
      # same job's "Start job-local iroh relay" step captured into
      # $RELAY_PID (via GITHUB_ENV, so it is the literal pid of the process
      # that step backgrounded, not a re-derived or reused one) reddens the
      # job if that process died at any point during the Gradle steps above.
      - name: Assert the job-local relay is still alive
        run: |
          set -euo pipefail
          if [ -z "${RELAY_PID:-}" ]; then
            echo "RELAY_PID is unset — the relay-start step did not run or did not export it" >&2
            exit 1
          fi
          if ! kill -0 "$RELAY_PID" 2>/dev/null; then
            echo "computenet-iroh-relay (pid $RELAY_PID) is not alive after the Gradle test steps" >&2
            echo "--- stdout ---" >&2
            cat /tmp/iroh-relay.out >&2 || true
            echo "--- stderr ---" >&2
            cat /tmp/iroh-relay.err >&2 || true
            exit 1
          fi
          echo "iroh-sidecar-relay-liveness pid=$RELAY_PID alive=true"
          kill "$RELAY_PID" 2>/dev/null || true

      # computenet-vnscs: the same non-vacuity argument as the relay
      # liveness step above, for the dns half of rendezvous. Every peer in
      # the Gradle steps above still holds a direct loopback address via
      # ADD_PEER, so both would pass identically against a dead
      # computenet-iroh-dns — `kill -0` on $DNS_PID (exported by "Start
      # job-local iroh dns" via GITHUB_ENV) is what makes the claim that
      # rendezvous ran against a live, job-local server non-vacuous in THIS
      # lane. This check only proves the server stayed up; it is not itself
      # proof that `LookupMode::Rendezvous` resolved correctly through it —
      # that functional proof is `tests/rendezvous_mode.rs`, exercised in
      # the "cargo test (timed)" step above.
      - name: Assert the job-local dns server is still alive
        run: |
          set -euo pipefail
          if [ -z "${DNS_PID:-}" ]; then
            echo "DNS_PID is unset — the dns-start step did not run or did not export it" >&2
            exit 1
          fi
          if ! kill -0 "$DNS_PID" 2>/dev/null; then
            echo "computenet-iroh-dns (pid $DNS_PID) is not alive after the Gradle test steps" >&2
            echo "--- stdout ---" >&2
            cat /tmp/iroh-dns.out >&2 || true
            echo "--- stderr ---" >&2
            cat /tmp/iroh-dns.err >&2 || true
            exit 1
          fi
          echo "iroh-sidecar-dns-liveness pid=$DNS_PID alive=true"
          kill "$DNS_PID" 2>/dev/null || true
