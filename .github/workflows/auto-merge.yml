name: Auto-merge

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Fork PRs get a read-only GITHUB_TOKEN, and drafts aren't merge candidates.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      # Enabling auto-merge only queues the PR; GitHub still waits for the
      # required status checks and mergeability before it squashes.
      # continue-on-error: this job just opts the PR into auto-merge as a
      # convenience — it must never block or fail the PR itself.
      - name: Enable auto-merge
        continue-on-error: true
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
