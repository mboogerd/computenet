org.gradle.caching=true
org.gradle.parallel=true

# (Note that some plugins may not yet be compatible with the configuration cache.)
# https://docs.gradle.org/current/userguide/configuration_cache.html
org.gradle.configuration-cache=true

# JVM sizing for the two long-lived daemons. Until this was set the build sized
# NOTHING while running `org.gradle.parallel=true`, so every compilation shared
# Gradle's 512m default ceiling. `build-test-fast` run 31374471280 attempt 1 died
# on it: `demo:shopping:compileKotlin` threw `java.lang.OutOfMemoryError: GC
# overhead limit exceeded` with the whole stack inside the Kotlin FIR frontend
# (`fir.resolve.calls.stages.ArgumentCheckingProcessor`), while three Kotlin
# compilations were in flight at once (`demo:shopping:compileKotlin`,
# `demo:exchange:compileTestKotlin`, `kernel:compileTestKotlin`) alongside
# `inspect:test`. GC-overhead-limit is the thrashing signature, not a single
# oversized allocation: the ceiling was simply too low for the concurrency.
#
# The two numbers are different because the two daemons carry different work,
# and the split is not the obvious one:
#
#   `kotlin.daemon.jvmargs` sizes the Kotlin COMPILE daemon, and that is where
#   the failure was. Gradle's default `--max-workers` is the CPU count (4 on a
#   GitHub `ubuntu-latest` runner), so up to four `compileKotlin` tasks run
#   concurrently INSIDE THIS ONE PROCESS. With nothing declared, KGP hands the
#   Kotlin daemon the Gradle daemon's `-Xmx`, i.e. 512m total for all of them.
#   Measured, not assumed: with these two lines removed, `jps -lv` shows both
#   `GradleDaemon` and `KotlinCompileDaemon` running `-Xmx512m
#   -XX:MaxMetaspaceSize=384m`; with them present it shows 2g and 3g
#   respectively. That is also the check that neither property name is a typo,
#   since a misspelled one is silently ignored. 3g is ~750m per concurrent
#   frontend with headroom, and 6x the ceiling that actually failed.
#
#   `org.gradle.jvmargs` sizes the Gradle daemon, which is not just a scheduler
#   here: KSP 2.1.21-2.0.1 is KSP2, and its `KspAATask` submits work through
#   `WorkerExecutor.noIsolation`, so every `kspKotlin` task runs the Kotlin
#   Analysis API in-process in the GRADLE daemon. `kotlin.daemon.jvmargs` does
#   not reach KSP at all. It gets less than the Kotlin daemon because the
#   evidence says it needs less: computenet-dqy.15 measured a cold-JVM full KSP
#   run at 3.68s with a 512m heap against 3.58s at 2g, with ZERO full GCs at
#   512m. 2g is 4x a ceiling already measured to be sufficient, and also covers
#   the configuration cache and four workers' task state.
#
# Sizing is bounded by the runner, not by generosity. `ubuntu-latest` is 4 vCPU
# / 16 GB (this repo is public, so the standard runner is the 4-vCPU/16 GB one,
# not the 2-vCPU/7 GB private-repo tier) and the fast lane also runs parallel
# test forks (`maxHeapSize = "2g"` per fork in `buildSrc`).
#
# How many forks, measured rather than assumed, because the ceilings only add up
# if you have the right count. Reconstructing the fork timeline from the JUnit
# XML of a cold `build check -PexcludeMultiJvm=true --max-workers=4` (269 test
# classes; overlapping class intervals must be distinct forks, since one fork
# runs one class at a time) gives a PEAK OF 4 CONCURRENT TEST JVMS, held for
# ~16s of the run — Gradle's worker-lease pool caps test forks at
# `--max-workers`, so the whole lane, not just `:kernel`'s two, is what fills
# it. So the honest ceiling sum is 4x2g of fork heap + 3g + 2g of daemon heap +
# metaspace ~= 16 GB, i.e. the ceilings do NOT all fit at once.
#
# That is tolerable only because -Xmx is a ceiling and not a reservation: none
# of these JVMs sets -Xms near its max, so the GC collects rather than expands
# under pressure. Sampled RSS during that same cold run, on a 16 GB machine that
# also had two sibling Gradle builds on it, peaked at ~3.8 GB of total Java RSS
# with the Kotlin daemon the largest single process at ~2.2 GB — a quarter of
# the ceiling. Treat the sum as a bound that must not grow, not as headroom:
# raising either number again, or raising per-fork `maxHeapSize`, is the change
# that would push this runner into swap, which is a worse failure than the one
# this fixes.
#
# Expected timing effect, stated up front so it does not silently invalidate
# PR #30's `build-test-fast` measurements: none intended. dqy.15 measured no
# speed win from a bigger heap on a build that was not GC-bound, so this should
# move the lane only on the runs that would otherwise have thrashed or died.
#
# `-XX:+HeapDumpOnOutOfMemoryError` is restated, not added: `org.gradle.jvmargs`
# REPLACES Gradle's default daemon arguments wholesale rather than appending to
# them, and the default set carries that flag. Diffed process-by-process on one
# machine: a daemon for a worktree without these lines runs with
# `+HeapDumpOnOutOfMemoryError`, `-Xms256m`, `-Xmx512m` and
# `-XX:MaxMetaspaceSize=384m`, so declaring only -Xmx and metaspace here
# silently drops the heap dump. On a bead whose whole
# subject is diagnosing an OOM, losing the one artefact that explains an OOM is
# not an acceptable side effect. `-Xms256m` is deliberately NOT restored: no
# -Xms lets the daemon grow lazily instead of committing 256m up front, which is
# the direction this runner wants.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m
